built_up_area:
- period: "509-390 BC"
  text: "Settlement concentrated on the Palatine, Capitol, Velia and the Forum valley, with extensions on the lower Esquiline, Caelian and Quirinal; fortified in parts by a 6th-century wall and an agger on the east."
  points: [[41.8925,12.4853],[41.8890,12.4870],[41.8935,12.4830]]
  source: "Cornell, Beginnings of Rome 1995 (modern synthesis); Platner-Ashby s.v. Roma"
- period: "390-378 BC"
  text: "After the Gallic sack (390), rebuilding on the old street plan was said to be hasty (Livy 5.55.2-5)."
  points: [[41.8925,12.4853]]
  source: "Livy 5.55.2-5"
- period: "378-250 BC"
  text: "City enclosed by the Servian Wall: circuit about 11 km, area about 426 ha; seven hills and the Forum within, the Campus Martius and Aventine suburbs outside (Aventine within the pomerium only from Claudius)."
  points: [[41.8885,12.4885],[41.8845,12.4850],[41.8795,12.4790],[41.8880,12.4793],[41.8920,12.4807],[41.8957,12.4830],[41.9068,12.4960],[41.8957,12.5017],[41.8885,12.4885]]
  source: "Livy 6.32.1; Platner-Ashby s.v. Murus Servii Tullii"
- period: "250-100 BC"
  text: "Growth outside the wall: Campus Martius (Circus Flaminius, porticoes), Emporium and Aventine riverside, Trastevere. Concrete tenements (insulae) and the first horrea."
  points: [[41.9000,12.4700],[41.8795,12.4765],[41.8825,12.4695]]
  source: "Livy 35.10.12; Livy 41.27.8; Platner-Ashby s.v. Roma"
- period: "100-27 BC"
  text: "Built-up area spills well beyond the Servian Wall: Campus Martius (Theatre of Pompey, Saepta), Trastevere, Esquiline and Via Appia. Roughly 1,300-1,800 ha continuously built by the end of the period (modern estimate); the Aurelian Wall (AD 271) later encloses 1,373 ha."
  points: [[41.9060,12.4770],[41.8760,12.4780],[41.9090,12.4950],[41.8700,12.4980]]
  source: "Modern estimates, Platner-Ashby s.v. Roma; the Aurelian Wall area is documented in Lanciani Forma Urbis"
