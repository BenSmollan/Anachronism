schema_version: 1
# Rome and Carthage, 264 BC: the deep successor of punic_wars.yaml (which stays until the lead retires it).
# Map: provinces_italy.yaml (it_*, si_*, sa_*, co_*) for Italy, Sicily, Sardinia and Corsica.
#
# HOW THE ITALIAN ALLIES ARE MODELLED (decision, see the report):
# The schema has no "ally" or lower-loyalty status for a province, only owners. Rome's Italian
# *socii* kept their own laws, magistrates and armies and were bound by treaty (Polybius 2.24 lists their
# levies separately from the Romans and Campanians), so they are modelled as separate civs in alliance
# with Rome: Samnites, Central Italics, Etruscans, Umbrians, Southern Italics, Greek cities. Rome itself
# owns only the ager Romanus, its citizen and Latin colonies and the peoples whose land it annexed
# (Latium, Volsci, Hernici, Aequi, Sabines, Aurunci, Campania, Picenum, Senones, Caere, Veii).
# A civ-per-people lets an ally defect after Cannae, as Capua, Tarentum and the Bruttians did (Polybius 3.118).
# Grouping is approximate: Latin colonies lie inside allied provinces and cannot be drawn at this grain.
# Sicily: Carthage holds the west (Lilybaeum, Panormus, Akragas, Enna); Hiero II holds Syracuse and Catana;
# the Mamertines hold Messana; Gela and Halaesa are unowned (their allegiance in 264 BC is not
# recorded in the sources read) # unverified. Carthage holds Sardinia (Polybius 1.10.5, 1.88) and Corsica.
# Scripts of the eastern states and the common tech baseline are carried over from punic_wars.yaml.
scenarios:
  - id: rome_264
    name: "Rome and Carthage, 264 BC"
    description: >-
      264 BC. Rome leads a mosaic of Italian allies from the Arno to the toe of Italy, and has never fought beyond the peninsula. Carthage rules the western sea. A quarrel over Messana in Sicily, where Hiero of Syracuse is also watching, is about to become the First Punic War. The consuls are Appius Claudius Caudex and Marcus Fulvius Flaccus. North of the Apennines the Gauls of the Po and the Ligurians are still unconquered.
    start_year: -264
    years_per_turn: 10
    campaign_years_per_turn: 2
    player_civ: rome
    map: europe
    music: roman  # the client plays client/music/<name>.mp3 (D-208)
    cost_scale: 10
    confidence: medium
    sources:
      - "Polybius 1.7-1.12 (the Mamertines, Hiero and the crossing to Messana)"
      - "Polybius 2.17-24 (peoples of Italy and the levies of Rome and her allies in 225 BC)"
      - "Polybius 1.10.5 (Carthage holds the islands of the Sardinian and Tyrrhenian seas)"
      - "Fasti Capitolini (consuls of 264 BC) # unverified"
    # what every state of the age knows, where it has the prerequisites (Rome's Twelve Tables, Greek city laws, Carthage's constitution)
    common_techs: {written_law: widespread}
    civs:
      rome:
        # Rome here is the ager Romanus and its citizen and Latin colonies, plus the peoples whose land
        # Rome had annexed outright (Sabines 290/268, Picentes 268, Senones 283). The allies (socii) are separate civs.
        # source for the consuls of 264 BC: Fasti Capitolini (Appius Claudius Caudex and Marcus Fulvius Flaccus).
        navy_bp: 500
        disposition: aggressive
        scripts:
          - {id: "first_punic_war", goal: "conquer", target: "carthage", preconditions: {after_year: -266}, note: "Rome crosses to Sicily and the First Punic War begins (264-241 BC). Polybius 1.11-1.63."}
          - {id: "seize_sardinia", goal: "conquer", target: "carthage", preconditions: {after_year: -240, before_year: -232}, depends_on: ["first_punic_war"], note: "Rome takes Sardinia from a Carthage crippled by the Mercenary War and adds 1,200 talents (238 BC). Polybius 1.88.8-12."}
          - {id: "first_illyrian_war", goal: "conquer", target: "e2_illyrians", preconditions: {after_year: -231}, depends_on: ["first_punic_war"], note: "Rome sends fleet and legions across the Adriatic against Queen Teuta (229 BC). Polybius 2.8-12."}
          - {id: "gallic_war_telamon", goal: "conquer", target: "e2_boii", preconditions: {after_year: -227}, depends_on: ["first_punic_war"], note: "Rome crushes the Gauls at Telamon (225 BC) and enters the lands of the Boii. Polybius 2.27-31."}
          - {id: "conquest_of_the_insubres", goal: "conquer", target: "e2_insubres", preconditions: {after_year: -224}, depends_on: ["gallic_war_telamon"], note: "Rome besieges Acerrae and wins at Clastidium (222 BC). Polybius 2.34."}
          - {id: "second_illyrian_war", goal: "conquer", target: "e2_illyrians", preconditions: {after_year: -221}, depends_on: ["first_illyrian_war"], note: "Rome drives Demetrius of Pharos from Illyria (219 BC). Polybius 3.16, 3.18-19."}
          - {id: "first_macedonian_war", goal: "conquer", target: "macedon", preconditions: {after_year: -216}, depends_on: ["hannibals_war"], note: "Philip V allies with Hannibal (215 BC); Rome keeps him busy in Greece. Polybius 7.9 (treaty); Livy 23.33-38 and 26.24."}
          - {id: "conquest_of_syracuse", goal: "conquer", target: "syracuse", preconditions: {after_year: -214}, depends_on: ["hannibals_war"], note: "Syracuse, gone over to Carthage after Hiero died, is stormed by Marcellus (212 BC). Polybius 8.3-7 (siege); Livy 25.23-31."}
          - {id: "scipio_in_africa", goal: "conquer", target: "carthage", preconditions: {after_year: -206}, depends_on: ["hannibals_war"], note: "Scipio crosses to Africa and defeats Hannibal at Zama (202 BC). Livy 30.29-35; Polybius 15.5."}
          - {id: "second_macedonian_war", goal: "conquer", target: "macedon", preconditions: {after_year: -201}, depends_on: ["scipio_in_africa"], note: "Flamininus defeats Philip V at Cynoscephalae (197 BC) and proclaims the freedom of Greece at the Isthmus. Polybius 18.19-27; Livy 33.7-10, 33.32."}
          - {id: "rome_vs_antiochus", goal: "conquer", target: "seleucid", preconditions: {after_year: -195}, depends_on: ["second_macedonian_war"], note: "The Scipios defeat Antiochus III at Magnesia (190 BC); treaty of Apamea 188. Livy 37.37-44, 38.38."}
          - {id: "third_macedonian_war", goal: "conquer", target: "macedon", preconditions: {after_year: -173}, depends_on: ["rome_vs_antiochus"], note: "Aemilius Paullus defeats Perseus at Pydna (168 BC); Macedon is cut into four republics. Livy 44.40-42, 45.29-32."}
          - {id: "numantine_war", goal: "conquer", target: "e2_celtiberians", preconditions: {after_year: -145}, depends_on: ["third_macedonian_war"], note: "Scipio Aemilianus starves Numantia into surrender (133 BC). Appian, Iberica 97 (unverified); Livy, Periochae 59 (unverified)."}
          - {id: "third_punic_war", goal: "conquer", target: "carthage", preconditions: {after_year: -151}, depends_on: ["scipio_in_africa"], note: "Rome demands the surrender of Carthage and destroys it (149-146 BC). Polybius 36.9 (opinions in Greece); Appian, Punica 74-135 (unverified)."}
          - {id: "achaean_war", goal: "conquer", target: "achaea", preconditions: {after_year: -149}, depends_on: ["third_macedonian_war"], note: "Mummius defeats the Achaean League and sacks Corinth (146 BC). Polybius 38.10-18 and 39.2."}
