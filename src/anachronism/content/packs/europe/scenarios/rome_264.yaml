schema_version: 1
# Rome and Carthage, 264 BC: the one start point, made deep (DEC007, DEC009).
# Map: provinces_italy.yaml (it_*, si_*, sa_*, co_*) for Italy, Sicily, Sardinia and Corsica.
#
# SOURCES: every civ, general, successor, script and starting relation below carries `sources`
# (ancient author first, book.chapter.section) and, where the evidence conflicts, `disputed`.
# Modern works were used only to check, never cited (docs/plans/rome.md:77). A cite still marked
# "# unverified" is one whose passage was not opened while writing this file; the hand-off names each.
# Texts read: Polybius (Paton, LacusCurtius), Livy 8-10 and 22-30 (Roberts, Wikisource), Livy Periochae
# (Lendering, livius.org), Velleius 1.14-15, Zonaras 8 (with Dio, LacusCurtius), Diodorus 22-23
# (LacusCurtius), Florus 1, Strabo 5-6, Justin (Watson, attalus.org), Pausanias 1 (theoi.com), the
# Fasti Capitolini and Triumphales (Degrassi, attalus.org), Pliny NH 7 (Bostock, Perseus).
#
# WHO HOLDS WHAT IN 264 BC (Italy, Sicily, Sardinia, Corsica; DEC006 and DEC013: no new provinces, the
# Latin colonies are noted on the province that holds them). Status words: ager Romanus = Roman land;
# sine suffragio = Roman citizens without the vote; Latin colony = a colony of Latin right (in law an
# allied state, here drawn as Rome's); socius = an ally by treaty; free = no Roman tie.
#   province       holder               status in 264                                   source                                  disputed
#   it_roma        rome                 ager Romanus, the City                          Polybius 2.24.14                        no
#   it_latium      rome                 citizen towns (Lanuvium, Aricia, Nomentum,      Livy 8.14; Polybius 2.24.10 (Latins)     grain: Tibur and Praeneste stay Latin allies
#                                       Pedum, Tusculum) and Latin allies
#   it_volsci      rome                 Antium and Velitrae settled 338; Setia,         Livy 8.14; Velleius 1.14.2, 1.14.4       no
#                                       Tarracina colonies
#   it_hernici     rome                 Hernici surrendered 306; Aletrium, Verulae,     Livy 9.43                               grain: three Hernican towns keep self-rule
#                                       Ferentinum keep their own laws
#   it_aequi       rome                 Aequi crushed 304; Alba and Carseoli Latin      Livy 9.45; Velleius 1.14.5              no
#                                       colonies
#   it_sabina      rome                 sine suffragio 290, the vote in 268             Velleius 1.14.6-7; Livy Per. 11.6       no
#   it_veii        rome                 ager Romanus; Sutrium and Nepet colonies        Velleius 1.14.2                         no
#   it_caere       rome                 citizens without the vote ("Caerite tablets")   Strabo 5.2.3                            no
#   it_aurunci     rome                 Fundi, Formiae citizens 338/334; Minturnae,     Livy 8.14; Velleius 1.14.3-4, 1.14.6     no
#                                       Sinuessa colonies 296; Suessa Aurunca
#   it_campania    rome                 Capua sine suffragio 338; Cales colony          Velleius 1.14.3; Livy 8.14; Pol. 2.24.14 no
#   it_picenum     rome                 Picentes beaten 268; Hadria 289; Firmum 264     Livy Per. 11.7, 15.4; Velleius 1.14.8;  grain: Asculum and the Picentes were given peace,
#                                                                                       Fasti Triumphales 268                  not annexed outright
#   it_senones     rome                 ager Gallicus, Senones driven out 283; Sena,    Polybius 2.19.10-12; Velleius 1.14.7;  no
#                                       Ariminum 268 colonies                           Livy Per. 15.5
#   it_picentini   rome                 Paestum (Posidonia) Latin colony 273; Picentes  Velleius 1.14.7; Livy Per. 14.8;       grain: a Latin colony and deportees, not ager Romanus
#                                       moved here by Rome                              Strabo 5.4.13
#   it_samnium     e2_samnites          socius, treaty renewed 290; Aesernia colony 263 Livy Per. 11.5, 16.7; Velleius 1.14.8   no
#   it_hirpini     e2_samnites          socius; Beneventum Latin colony 268             Velleius 1.14.7; Livy Per. 15.5         grain: Beneventum is Rome's, drawn allied
#   it_marsi       e2_central_italics   socii by treaty of 304                          Livy 9.45; Polybius 2.24.12             no
#   it_frentani    e2_central_italics   socii by treaty of 304                          Livy 9.45; Polybius 2.24.12             no
#   it_tarquinii   e2_etruscans         socius; Cosa Latin colony 273                   Velleius 1.14.7; Livy Per. 14.8         grain: Cosa is Rome's, drawn allied
#   it_volsinii    e2_volsinii          AT WAR: besieged by the consul                  Zonaras 8.7; Florus 1.16;               consul: Zonaras and Florus name Q. Fabius
#                                                                                       Fasti Triumphales 264                   Gurges (265); the Fasti, M. Fulvius Flaccus (264)
#   it_populonia   e2_etruscans         socius                                          Polybius 2.24.5                         no
#   it_arretium    e2_etruscans         socius                                          Polybius 2.19.7-8, 2.24.5               no
#   it_etruria_n   e2_etruscans         socius                                          Polybius 2.24.5                         no
#   it_falisci     e2_etruscans         socius (Falerii revolts in 241)                 Fasti Triumphales 241                   no
#   it_umbria      e2_umbrians          socii, Umbrians and Sassinates beaten 267-266;  Livy Per. 15.7; Fasti Triumphales 266;  grain: Narnia is Rome's, drawn allied
#                                       Narnia Latin colony 299                         Livy 10.10; Polybius 2.24.7
#   it_lucania     e2_southern_italics  socii                                           Polybius 2.24.12                        no
#   it_bruttium    e2_southern_italics  socii                                           Polybius 1.20.14 (Locri lends ships)    no
#   it_apulia      e2_southern_italics  socii; Luceria and Venusia Latin colonies       Velleius 1.14.4, 1.14.6; Pol. 2.24.11   grain: two colonies drawn allied
#   it_peucetia    e2_southern_italics  socii                                           Polybius 2.24.11                        no
#   it_messapia    e2_southern_italics  Sallentini and Messapii beaten 267-266          Livy Per. 15.7; Fasti Triumphales 266   no
#   it_neapolis    e2_italiote_greeks   socius by treaty (326)                          Livy 8.26; Polybius 1.20.14             no
#   it_tarentum    e2_italiote_greeks   socius since 272                                Livy Per. 15.1; Polybius 1.20.14        no
#   it_rhegium     e2_italiote_greeks   restored to its citizens 270                    Polybius 1.7.10-13; Livy Per. 15.2      no
#   it_boii        e2_boii              free, at peace since the treaty after Vadimon   Polybius 2.20.5, 2.21.1                 no
#   it_insubres    e2_insubres          free                                            Polybius 2.17, 2.21.1                   no
#   it_cenomani    e2_cenomani          free                                            Polybius 2.17, 2.23.2                   no
#   it_veneti      e2_veneti            free                                            Polybius 2.17.5-6, 2.23.2               no
#   it_liguria     e2_ligurians         free                                            Polybius 2.16.1-2                       no
#   it_ligures_apuani e2_ligurians      free                                            Polybius 2.16.1-2                       no
#   it_taurini     unowned              free                                            Polybius 3.60.8-10                      no
#   it_salassi     unowned              free                                            (no source for 264)                     no
#   si_messana     e2_mamertines        the Mamertines; a Punic garrison in the citadel Polybius 1.7.2-5, 1.10.1-2, 1.11.4      no
#   si_syracuse    syracuse             Hiero's kingdom, with Leontini                  Polybius 1.9.8; Diodorus 23.4.1         no
#   si_catana      unowned              free city                                       Diodorus 23.4.1; Pliny NH 7.214         yes: Diodorus leaves Catana out of Hiero's 263
#                                                                                                                               cities but names Tauromenium (in this province);
#                                                                                                                               Pliny has Catina "captured" in 263
#   si_enna        carthage             Carthaginian or allied interior                 Polybius 1.10.8; Diodorus 22.10.1,      yes: Enna had a Punic garrison in 278 and is
#                                                                                       23.9.5                                  taken from one in 258; its status in 264 is not told
#   si_akragas     carthage             allied to Carthage, its citadel fortified       Diodorus 23.1.2; Polybius 1.17.5        yes: a free city allied to Carthage in 264
#                                       by Hanno                                                                                (Diodorus); Carthage's base only from 262 (Polybius)
#   si_gela        unowned              free (Phintias moved Gela's people to his city) Diodorus 22.2.2, 23.9.5                 yes: no source states its ties in 264
#   si_halaesa     unowned              free                                            Diodorus 22.13.2, 23.4.1                yes: Hiero took Halaesa and Tyndaris c. 269,
#                                                                                                                               but Halaesa treats with Rome on its own in 263
#   si_panormus    carthage             Punic                                           Polybius 1.21.6, 1.24.3                 no
#   si_lilybaeum   carthage             Punic epikrateia                                Diodorus 23.1.2                         no
#   sa_sardinia    carthage             Punic                                           Polybius 1.10.5, 1.24.5-7               no
#   sa_barbagia    unowned              the unsubdued interior                          (no source for 264)                     no
#   co_corsica     carthage             Punic, as Polybius puts it                      Polybius 1.10.5; Fasti Triumphales 259  yes: Polybius gives Carthage "all the islands"
#                                                                                                                               of the Tyrrhenian Sea, but nothing shows a
#                                                                                                                               Punic hold on Corsica before Scipio's raid (259)
#   car_gades      carthage             Phoenician Gades, Carthage's ally               Polybius 1.10.5, 2.1.5-7                yes: Polybius says Carthage held "a great part of
#                                                                                                                               Spain" in 264, yet Hamilcar subjugates it from 237
#
# HOW THE ITALIAN ALLIES ARE MODELLED (D-287):
# The schema has no "ally" or lower-loyalty status for a province, only owners. Rome's Italian
# *socii* kept their own laws, magistrates and armies and were bound by treaty (Polybius 2.24.10-14 lists
# their levies apart from the Romans and Campanians), so they are separate civs in alliance with Rome:
# Samnites, Central Italics, Etruscans, Umbrians, Southern Italics, Greek cities. Rome itself owns the
# ager Romanus, its citizen and Latin colonies and the peoples whose land it annexed (see the table).
# A civ-per-people lets an ally defect after Cannae, as Tarentum, Arpi and Campanian towns did (Polybius 3.118.2).
# Volsinii is its own state because Rome is at war with it in 264 (DEC014). Cyrene is Magas' kingdom (DEC014).
# Not carried, for want of an engine office (an R2 row): the yearly consuls and censors. The consuls of 264
# are Ap. Claudius Caudex and M. Fulvius Flaccus (Fasti Capitolini 264; Polybius 1.11.3); the censors of 265,
# Cn. Cornelius Blasio and C. Marcius Rutilus Censorinus, closed the 35th lustrum (Fasti Capitolini 265).
scenarios:
  - id: rome_264
    name: "Rome and Carthage, 264 BC"
    description: >-
      264 BC. Rome leads a mosaic of Italian allies from the Arno to the toe of Italy, and has never fought beyond the peninsula. Carthage rules the western sea. A quarrel over Messana in Sicily, where Hiero of Syracuse is also watching, is about to become the First Punic War. The consuls are Appius Claudius Caudex and Marcus Fulvius Flaccus, and Rome is already at war in Etruria, besieging Volsinii. North of the Apennines the Gauls of the Po and the Ligurians are still unconquered.
    start_year: -264
    years_per_turn: 10
    campaign_years_per_turn: 2
    player_civ: rome
    map: europe
    music: roman  # the client plays client/music/<name>.mp3 (D-208)
    cost_scale: 10
    confidence: medium
    sources:
      - "Polybius 1.7-1.12 (the Mamertines, Hiero and the crossing to Messana)"
      - "Polybius 2.17-24 (peoples of Italy and the levies of Rome and her allies in 225 BC)"
      - "Polybius 1.10.5 (Carthage holds the islands of the Sardinian and Tyrrhenian seas)"
      - "Fasti Capitolini, 264 BC (consuls Ap. Claudius Caudex and M. Fulvius Flaccus)"
      - "Velleius Paterculus 1.14.2-8 (the colonies and grants of citizenship, with their years)"
      - "Livy, Periochae 11-16 (Rome's wars and colonies, 292-263 BC)"
      - "Diodorus 22.13, 23.1-4 (Sicily in 269-263 BC)"
    # what every state of the age knows, where it has the prerequisites (Rome's Twelve Tables, Greek city laws, Carthage's constitution)
    common_techs: {written_law: widespread}
    civs:
      rome:
        # Rome here is the ager Romanus and its citizen and Latin colonies, plus the peoples whose land
        # Rome had annexed outright (Sabines 290/268, Picentes 268, Senones 283). The allies (socii) are separate civs.
        # Paestum (it_picentini, Latin colony 273) is Rome's here: Rome holds 13 provinces in 264, not 12.
        # NUMBERS, and how they were reached (each a derivation, not a quotation):
        # - Citizens: the lustrum of the censors of 265/4 counted 382,234 citizens (Livy, Per. 16.4-5; censors
        #   in Fasti Capitolini 265). Eutropius 2.18 gives 292,334 for the same census: disputed, and the
        #   game follows Livy. Populations: 1,290,000 people on Rome's 13 provinces = the census (adult male
        #   citizens) times about 3.4 for women, children and slaves. The multiplier is a modelling assumption;
        #   no ancient source gives one. Polybius 2.24.14 (250,000 foot and 23,000 horse of Romans and
        #   Campanians on the rolls in 225) checks the order of size.
        # - Manpower: martial_bp stays at the usual 10,000. Polybius 1.16.2 has four citizen legions a year
        #   of 4,000 foot and 300 horse, with the allies apart; the allied levies sit with the allied civs.
        # - Navy: navy_bp 500, a twentieth of the usual. In 264 Rome had "not any decked ships, but no long
        #   warships at all, not even a single boat", and crossed to Messana in fifty-oared boats and triremes
        #   borrowed from Tarentum, Locri, Elea and Naples (Polybius 1.20.13-14). Its first fleet of 100
        #   quinqueremes and 20 triremes came later (Polybius 1.20.9).
        navy_bp: 500
        disposition: aggressive
        sources:
          - "Polybius 1.11.3 (the people vote for war; the consul Appius Claudius is sent to Messana)"
          - "Fasti Capitolini, 264 BC (consuls Ap. Claudius Caudex and M. Fulvius Flaccus)"
          - "Livy, Periochae 16.4-5 (the lustrum: 382,234 citizens)"
          - "Polybius 1.20.13-14 (no warships; boats borrowed from Tarentum, Locri, Elea and Naples)"
          - "Polybius 1.16.2 (four citizen legions a year, each 4,000 foot and 300 horse)"
        disputed: "The census of 265/4: Livy, Per. 16.5 has 382,234 citizens, Eutropius 2.18 has 292,334; the game follows Livy."
        scripts:
          - {id: "first_punic_war", goal: "conquer", target: "carthage", preconditions: {after_year: -266}, note: "Rome crosses to Sicily and the First Punic War begins (264-241 BC). Polybius 1.11-1.63.", sources: ["Polybius 1.11.3-1.12.4 (the vote, the crossing and the first battles at Messana)", "Polybius 1.62.7-1.63.3 (the peace of Lutatius, 241 BC)"]}
          - {id: "seize_sardinia", goal: "conquer", target: "carthage", preconditions: {after_year: -240, before_year: -232}, depends_on: ["first_punic_war"], note: "Rome takes Sardinia from a Carthage crippled by the Mercenary War and adds 1,200 talents (238 BC). Polybius 1.88.8-12.", sources: ["Polybius 1.88.8-12"]}
          - {id: "first_illyrian_war", goal: "conquer", target: "e2_illyrians", preconditions: {after_year: -231}, depends_on: ["first_punic_war"], note: "Rome sends fleet and legions across the Adriatic against Queen Teuta (229 BC). Polybius 2.8-12.", sources: ["Polybius 2.8.1-2.12.3"]}
          - {id: "gallic_war_telamon", goal: "conquer", target: "e2_boii", preconditions: {after_year: -227}, depends_on: ["first_punic_war"], note: "Rome crushes the Gauls at Telamon (225 BC) and enters the lands of the Boii. Polybius 2.27-31.", sources: ["Polybius 2.27.1-2.31.1"]}
          - {id: "conquest_of_the_insubres", goal: "conquer", target: "e2_insubres", preconditions: {after_year: -224}, depends_on: ["gallic_war_telamon"], note: "Rome besieges Acerrae and wins at Clastidium (222 BC). Polybius 2.34.", sources: ["Polybius 2.34.1-15"]}
          - {id: "second_illyrian_war", goal: "conquer", target: "e2_illyrians", preconditions: {after_year: -221}, depends_on: ["first_illyrian_war"], note: "Rome drives Demetrius of Pharos from Illyria (219 BC). Polybius 3.16, 3.18-19.", sources: ["Polybius 3.16.1", "Polybius 3.18.1-3.19.13"]}
          - {id: "first_macedonian_war", goal: "conquer", target: "macedon", preconditions: {after_year: -216}, depends_on: ["hannibals_war"], note: "Philip V allies with Hannibal (215 BC); Rome keeps him busy in Greece. Polybius 7.9 (treaty); Livy 23.33-38 and 26.24.", sources: ["Polybius 7.9 (the sworn treaty of Hannibal and Philip)", "Livy 23.33-38", "Livy 26.24 (Laevinus' treaty with the Aetolians)"]}
          - {id: "conquest_of_syracuse", goal: "conquer", target: "syracuse", preconditions: {after_year: -214}, depends_on: ["hannibals_war"], note: "Syracuse, gone over to Carthage after Hiero died, is stormed by Marcellus (212 BC). Polybius 8.3-7 (siege); Livy 25.23-31.", sources: ["Polybius 8.3-8.7 (the siege and Archimedes' engines)", "Livy 25.23-31 (the fall of Syracuse)"]}
          - {id: "scipio_in_africa", goal: "conquer", target: "carthage", preconditions: {after_year: -206}, depends_on: ["hannibals_war"], note: "Scipio crosses to Africa and defeats Hannibal at Zama (202 BC). Livy 30.29-35; Polybius 15.9-16.", sources: ["Polybius 15.9-16 (Zama)", "Livy 30.29-35"]}
          - {id: "second_macedonian_war", goal: "conquer", target: "macedon", preconditions: {after_year: -201}, depends_on: ["scipio_in_africa"], note: "Flamininus defeats Philip V at Cynoscephalae (197 BC) and proclaims the freedom of Greece at the Isthmus. Polybius 18.19-27; Livy 33.7-10, 33.32.", sources: ["Polybius 18.19-27 (Cynoscephalae)", "Livy 33.7-10", "Livy 33.32 (the Isthmian proclamation)"]}
          - {id: "rome_vs_antiochus", goal: "conquer", target: "seleucid", preconditions: {after_year: -195}, depends_on: ["second_macedonian_war"], note: "The Scipios defeat Antiochus III at Magnesia (190 BC); treaty of Apamea 188. Livy 37.37-44, 38.38.", sources: ["Livy 37.37-44 (Magnesia)", "Livy 38.38 (the treaty of Apamea)"]}
          - {id: "third_macedonian_war", goal: "conquer", target: "macedon", preconditions: {after_year: -173}, depends_on: ["rome_vs_antiochus"], note: "Aemilius Paullus defeats Perseus at Pydna (168 BC); Macedon is cut into four republics. Livy 44.40-42, 45.29-32.", sources: ["Livy 44.40-42 (Pydna)", "Livy 45.29-32 (Macedon divided)"]}
          - {id: "numantine_war", goal: "conquer", target: "e2_celtiberians", preconditions: {after_year: -145}, depends_on: ["third_macedonian_war"], note: "Scipio Aemilianus starves Numantia into surrender (133 BC). Livy, Periochae 57 and 59.", sources: ["Livy, Periochae 57.1-9 (Scipio besieges Numantia)", "Livy, Periochae 59.1 (Numantia falls)"]}
          - {id: "third_punic_war", goal: "conquer", target: "carthage", preconditions: {after_year: -151}, depends_on: ["scipio_in_africa"], note: "Rome demands the surrender of Carthage and destroys it (149-146 BC). Livy, Periochae 49-51; Polybius 38.19-22.", sources: ["Livy, Periochae 49.2-12 (war declared, the siege begins)", "Livy, Periochae 51.1-3 (Carthage taken, 146 BC)", "Polybius 38.19-22 (Scipio at the fall of Carthage)"]}
          - {id: "achaean_war", goal: "conquer", target: "achaea", preconditions: {after_year: -149}, depends_on: ["third_macedonian_war"], note: "Mummius defeats the Achaean League and sacks Corinth (146 BC). Polybius 38.10-18 and 39.2.", sources: ["Polybius 38.10-18", "Polybius 39.2 (the sack of Corinth)"]}
        capital: it_roma
        leader: Consul Appius Claudius Caudex
        # Caudex's age is unknown: no ancient source gives his birth year. 45 is a placeholder for a consul.
        leader_age: 45
        # Yearly consuls cannot be carried as `successors` (rulers.py: "takes the throne"); an R2 engine row.
        # Generals in the order the war used them: Fulvius Flaccus at Volsinii (264), Valerius in Sicily (263),
        # Postumius and Mamilius at Agrigentum (262), Duilius at Mylae (260), Scipio in Corsica (259), Regulus (256).
        generals:
          - {name: "Marcus Fulvius Flaccus", skill: 2, trait: siege, note: "Consul of 264 BC, Caudex's colleague; triumphs over the Volsinians on 1 November.", sources: ["Fasti Capitolini, 264 BC", "Fasti Triumphales, 264/3 BC (over the Vulsinienses)"]}
          - {name: "Manius Valerius Maximus", skill: 3, trait: siege, note: "Consul in 263 BC; takes Hadranum, wins over Halaesa and sixty-seven towns, and forces Hiero to terms. Called Messalla.", sources: ["Polybius 1.16.1-3", "Diodorus 23.4.1 (Hadranum, Centuripa, sixty-seven cities)", "Fasti Triumphales, 263/2 BC (over the Carthaginians and Hiero)"]}
          - {name: "Lucius Postumius Megellus", skill: 2, trait: siege, note: "Consul of 262 BC; besieges Agrigentum with Mamilius.", sources: ["Polybius 1.17.6-8", "Fasti Capitolini, 262 BC"]}
          - {name: "Quintus Mamilius Vitulus", skill: 2, note: "Consul of 262 BC; holds the lines at Agrigentum.", sources: ["Polybius 1.17.6-8", "Fasti Capitolini, 262 BC"]}
          - {name: "Gaius Duilius", skill: 2, trait: shield, note: "Victor of Mylae, Rome's first sea battle (260 BC), and the first naval triumph.", sources: ["Polybius 1.22.1, 1.23.1-4", "Fasti Triumphales, 260/59 BC"]}
          - {name: "Lucius Cornelius Scipio", skill: 2, note: "Consul of 259 BC; takes Aleria in Corsica and sails on Sardinia.", sources: ["Zonaras 8.11", "Fasti Triumphales, 259/8 BC (over the Carthaginians, Sardinia and Corsica)"]}
          - {name: "Marcus Atilius Regulus", skill: 3, trait: bold, note: "Consul who carries the war to Africa and is taken prisoner (256-255 BC).", sources: ["Polybius 1.26.11, 1.29.1, 1.34.8-12"]}
        pitch: "Two consuls, a Senate of families and a federation of allies bound by treaty rather than conquest. Carthage rules the western sea; the question is what Rome does with Sicily."
        provinces:
          it_roma: 256000
          it_latium: 192000
          it_veii: 48000
          it_volsci: 104000
          it_hernici: 52000
          it_aequi: 36000
          it_sabina: 88000
          it_caere: 48000
          it_aurunci: 44000
          it_campania: 240000
          it_picenum: 104000
          it_senones: 44000
          it_picentini: 32000
        stockpiles: {food: 2009, materials: 502, wealth: 628, knowledge: 314}
        stats: {literacy_bp: 500, unrest_bp: 800, legitimacy_bp: 7000}
        influence: {clergy: 2500, nobility: 5500, guilds: 2000}
        # Rome's start techs, checked one by one against 264 BC. "judgement" = common to Iron Age Italy and
        # needs no single passage; a cite is given where a passage shows the thing in Roman use by 264.
        techs:
          republic: widespread  # Polybius 1.11.1-3 (Senate, people and consuls decide the war of 264); Polybius 6.11-18
          agriculture: widespread  # judgement
          irrigation: widespread  # judgement
          ox_plough: widespread  # judgement
          iron_plough: adopted  # judgement
          pottery_kiln: widespread  # judgement
          charcoal_burning: widespread  # judgement
          wheel: widespread  # judgement; Livy 10.28 (wagons at Sentinum, 295)
          herbal_medicine: widespread  # judgement
          copper_smelting: widespread  # Polybius 6.23.14 (the bronze heart-protector)
          bronze_working: widespread  # Polybius 6.23.14
          iron_working: widespread  # Polybius 6.22.1, 6.23.1 (swords, javelins, the panoply of the hastati)
          ore_prospecting: adopted  # judgement
          writing: widespread  # Polybius 3.22.3 (Rome's treaty with Carthage of 509 in archaic Latin)
          alphabet: widespread  # Polybius 3.22.3
          masonry: widespread  # Frontinus Aq. 1.5 (the Appian aqueduct and road, 312)
          surveying: adopted  # Velleius 1.14.2-8 (colonies laid out on allotted land)
          astronomy_calendar: adopted  # judgement; the first sundial reaches Rome only in 263 (Pliny NH 7.214)
          standard_measures: widespread  # judgement
