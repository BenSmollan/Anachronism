schema_version: 1
# Italy, Sicily, Sardinia and Corsica at the grain of their peoples, for the Roman Republic, 509-27 BC (D-286).
# Each province is one people or region, centred on its chief ancient town (latlon: degrees north, east).
# Sources are in the `# source:` comment on each province: ancient authors first (Strabo book 5-6 for
# the peoples and towns, Polybius 2 for the manpower of Italy in 225 BC, Livy for conquests and colonies).
# capacity is about the free-and-slave population each region carried c. 225 BC (Polybius 2.24 gives
# ~700,000 foot and ~70,000 horse for Rome and her allies, hence 3-5 million people in all): the
# peninsula with Cisalpine Gaul sums to ~4.0 million, the islands to ~0.9 million.
# Resources are only those an ancient source attests; grain and pasture come from the terrain.
# Neighbours, coastal flags and centres are checked against the real map with client/tools/province_report.gd.
# Provinces added to the lead's skeleton are marked ADDED with the reason; no skeleton id was dropped.
provinces:

  # --- Rome, Latium and the Latin-speaking south of the Tiber ---
  # source: Livy (Ancus Marcius' salt-works at Ostia); Strabo 5.3.5 (Ostia, harbourless, silted by the Tiber); Polybius 2.24 (250,000 foot and 23,000 horse of Romans and Campanians in 225 BC)  # unverified: passage numbers not yet read and so withheld
  - id: it_roma
    name: "Rome and the Ager Romanus"
    latlon: [41.85, 12.42]
    terrain: plains
    coastal: true
    river: true
    capacity: 320000
    resources: {salt: accessible, stone: accessible}
    neighbours: [it_latium, it_veii]
  # source: Livy (the Latin cities after 338 BC); Strabo 5.3.10(Gabii's quarry and 'red stone'); Polybius 2.24 (Latins 80,000 foot, 5,000 horse)  # unverified: passage numbers not yet read and so withheld
  # note: Praeneste is the centre; the Alban hills (Tusculum, the old Latin League sanctuary) lie inside it, and Alba Longa, destroyed in legend (Livy), gets no separate province.  # unverified
  - id: it_latium
    name: "Latium (Praeneste, Tibur, Tusculum, the Alban hills, Lavinium)"
    latlon: [41.84, 12.89]
    terrain: hills
    coastal: false
    river: false
    capacity: 240000
    resources: {stone: accessible}
    neighbours: [it_aequi, it_hernici, it_roma, it_veii, it_volsci]
  # source: Livy (Corioli, Antium); (Antium taken 338 BC); Strabo 5.3.5 (Antium on rock)  # unverified: passage numbers not yet read and so withheld
  # note: Centred inland on Setia and Privernum so the province borders Latium, Hernici and Aurunci as the real Volscian country did; Antium and the coast belong to it. The Rutuli of Ardea (Livy) are folded into Latium and Rome: Ardea is too small for its own province.  # unverified
  - id: it_volsci
    name: "Volsci (Setia, Privernum, Velitrae, Antium, the Pomptine plain)"
    latlon: [41.48, 13.06]
    terrain: plains
    coastal: true
    river: false
    capacity: 130000
    resources: {}
    neighbours: [it_aurunci, it_hernici, it_latium]
  # source: Livy (Hernici lose independence 306 BC, Anagnia their capital); Strabo 5.3.10 (Anagnia)  # unverified: passage numbers not yet read and so withheld
  - id: it_hernici
    name: "Hernici (Anagnia, Ferentinum, Aletrium)"
    latlon: [41.74, 13.15]
    terrain: hills
    coastal: false
    river: true
    capacity: 65000
    resources: {}
    neighbours: [it_aequi, it_aurunci, it_latium, it_marsi, it_volsci]
  # source: Livy (Aequi crushed 304 BC); (Alba Fucens colony 303 BC); (Carseoli colony 298 BC); Strabo 5.3.1  # unverified: passage numbers not yet read and so withheld
  - id: it_aequi
