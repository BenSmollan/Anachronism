schema_version: 1
# Italy, Sicily, Sardinia and Corsica at the grain of their peoples, for the Roman Republic, 509-27 BC (D-286).
# Each province is one people or region, centred on its chief ancient town (latlon: degrees north, east).
# SOURCES: each province carries `sources` (ancient author first, book.chapter.section, each passage opened
# and read: Strabo 4-6 and Polybius 1-3 (LacusCurtius), Livy (Wikisource, Roberts; Latin Library), Livy's
# Periochae (livius.org), Velleius 1.14-15 and Diodorus 22-23 (LacusCurtius), Zonaras 8 and the Fasti
# Triumphales (LacusCurtius, attalus.org), Cicero's Verrines and Brutus (Latin Library), Pliny NH (Bostock,
# Perseus: Bostock's chapter numbers), Diodorus 5.13 (Perseus Greek), Pausanias 10.17 (theoi.com)) and
# `disputed` where the sources conflict. Modern works were used only to check, never cited.
# Each province's comment starts with what it was in 264 BC, the start of rome_264; the holder there matches the
# ownership table at the top of scenarios/rome_264.yaml. Latin and Roman colonies are named on the province that holds
# them (DEC013: no new provinces).
# capacity is about the free-and-slave population each region carried c. 225 BC (Polybius 2.24.16 gives
# ~700,000 foot and ~70,000 horse for Rome and her allies, hence 3-5 million people in all): the
# peninsula with Cisalpine Gaul sums to ~4.0 million, the islands to ~0.9 million.
# Resources are only those an ancient source attests; grain and pasture come from the terrain.
# Neighbours, coastal flags and centres are checked against the real map with client/tools/province_report.gd.
# Provinces added to the lead's skeleton are marked ADDED with the reason; no skeleton id was dropped.
provinces:

  # --- Rome, Latium and the Latin-speaking south of the Tiber ---
  # 264 BC: Rome's own: the City and the citizen land round it (ager Romanus), with Ostia, Rome's port and salt-works at the Tiber mouth.
  # note: the stone is the Tiburtine and Gabine stone shipped down to Rome by water (Strabo 5.3.11).
  - id: it_roma
    name: "Rome and the Ager Romanus"
    latlon: [41.85, 12.42]
    terrain: plains
    coastal: true
    river: true
    capacity: 320000
    resources: {salt: accessible, stone: accessible}
    neighbours: [it_latium, it_veii]
    sources:
      - "Livy 1.33.9 (Ancus Marcius builds Ostia at the Tiber mouth; salt-works on both banks)"
      - "Strabo 5.3.5 (Ostia harbourless, silted by the Tiber; founded by Ancus Marcius)"
      - "Strabo 5.3.11 (Tiburtine and Gabine stone carried to Rome by water)"
      - "Polybius 2.24.14 (Romans and Campanians on the rolls in 225 BC: 250,000 foot, 23,000 horse)"
  # 264 BC: Rome's. After the Latin War (338) Lanuvium, Aricia, Nomentum and Pedum were made Roman citizens and Tusculum kept its citizenship;
  #   Tibur and Praeneste stayed Latin allies, fined of land (Livy 8.14). Drawn as Rome's; the two Latin allies are the dispute.
  # note: Praeneste is the centre; the Alban hills (Tusculum, the old Latin sanctuary) lie inside it. Alba itself was destroyed but for its temple (Strabo 5.3.4) and gets no province.
  - id: it_latium
    name: "Latium (Praeneste, Tibur, Tusculum, the Alban hills, Lavinium)"
    latlon: [41.84, 12.89]
    terrain: hills
    coastal: false
    river: false
    capacity: 240000
    resources: {stone: accessible}
    neighbours: [it_aequi, it_hernici, it_roma, it_veii, it_volsci]
    sources:
      - "Livy 8.14 (the settlement of Latium, 338 BC; Tibur and Praeneste fined of land, 8.14.9)"
      - "Strabo 5.3.4 (Alba destroyed except the temple)"
      - "Strabo 5.3.10 (Gabii's quarry, the most serviceable to Rome; Praeneste)"
      - "Strabo 5.3.11 (Tibur, Praeneste and Tusculum; the Tiburtine and Gabine 'red stone' quarries)"
      - "Polybius 2.24.10 (Latins on the rolls in 225 BC: 80,000 foot, 5,000 horse)"
    disputed: "Tibur and Praeneste were Latin allies, not Roman citizens, in 264 (Livy 8.14.9); the province is drawn as Rome's because most of it was Roman citizen land."
  # 264 BC: Rome's. Antium lost its fleet and took Roman settlers in 338 (Livy 8.14); Setia (Velleius 1.14.2) and Tarracina (Velleius 1.14.4) are colonies.
  # note: centred inland on Setia and Privernum so the province borders Latium, Hernici and Aurunci as the real Volscian country did; Antium and the coast belong to it.
  # note: the Rutuli of Ardea (Strabo 5.3.2) are folded into Latium and Rome: Ardea is too small for its own province.
  - id: it_volsci
    name: "Volsci (Setia, Privernum, Velitrae, Antium, the Pomptine plain)"
    latlon: [41.48, 13.06]
    terrain: plains
    coastal: true
    river: false
    capacity: 130000
    resources: {}
    neighbours: [it_aurunci, it_hernici, it_latium]
    sources:
      - "Livy 8.14 (Antium's ships burnt or taken to Rome, its people settled; Velitrae punished, 338 BC)"
      - "Velleius 1.14.2 (Setia colony), 1.14.4 (Tarracina colony)"
      - "Strabo 5.3.5 (Antium, harbourless, on rock; once pirates with the Tyrrheni)"
      - "Strabo 5.3.10 (Setia, Signia, Privernum, Velitrae)"
  # 264 BC: Rome's. The Hernici rose and were beaten in 306: Anagnia and the rebels became citizens without the vote; Aletrium, Verulae and Ferentinum kept their own laws (Livy 9.43).
  - id: it_hernici
    name: "Hernici (Anagnia, Ferentinum, Aletrium)"
    latlon: [41.74, 13.15]
    terrain: hills
    coastal: false
    river: true
    capacity: 65000
    resources: {}
    neighbours: [it_aequi, it_aurunci, it_latium, it_marsi, it_volsci]
    sources:
      - "Livy 9.42-43 (the Hernican council at Anagnia; the settlement of 306 BC)"
      - "Strabo 5.3.10 (Anagnia, a noteworthy city of the Hernici)"
    disputed: "Aletrium, Verulae and Ferentinum chose their own laws over Roman citizenship (Livy 9.43); the province is drawn as Rome's."
  # 264 BC: Rome's. The Aequi were all but wiped out in 304 (Livy 9.45); Alba Fucens (303) and Carseoli (298) are Latin colonies, drawn as Rome's.
  - id: it_aequi
    name: "Aequi (Carseoli, Alba Fucens)"
    latlon: [42.07, 13.07]
    terrain: mountains
    coastal: false
    river: false
    capacity: 45000
    resources: {}
    neighbours: [it_hernici, it_latium, it_marsi, it_sabina]
    sources:
      - "Livy 9.45 (thirty-one Aequian towns taken in fifteen days, 304 BC)"
      - "Livy 10.1 (6,000 colonists to Alba in the Aequian country)"
      - "Livy 10.13 (colony settled at Carseoli)"
      - "Velleius 1.14.5 (Alba and Carseoli colonies)"
      - "Strabo 5.3.4 (the overthrow of the Aequi), 5.3.11 (Carseoli and Alba on the Valerian Way)"
  # 264 BC: Rome's. The Sabines were subdued in 290 (Livy Per. 11.6), given citizenship without the vote the same year and the vote in 268 (Velleius 1.14.6-7).
  # note: Reate's mules are famous (Strabo 5.3.1), but no resource id fits.
  - id: it_sabina
    name: "Sabine country (Reate, Cures, Nomentum)"
    latlon: [42.4, 12.86]
    terrain: hills
    coastal: false
    river: true
    capacity: 110000
    resources: {}
    neighbours: [it_aequi, it_falisci, it_picenum, it_umbria]
    sources:
      - "Strabo 5.3.1 (Sabine country from Nomentum to the Vestini; Reate and its mules; Cures)"
      - "Livy, Periochae 11.6 (Curius Dentatus subdues the Sabines)"
      - "Velleius 1.14.6 (citizenship without the vote, 290 BC), 1.14.7 (the vote, 268 BC)"

  # --- Etruria and the Etruscan borderlands ---
  # 264 BC: an ally of Rome (socius), drawn with the Etruscan allies. Falerii revolts in 241, is taken in a few days (Polybius 1.65.2), and loses half its land; the old hill-town is pulled down and rebuilt on the plain (Zonaras 8.18).
  # note: ADDED: the Falisci are a people of their own with their own speech, not Etruscans (Strabo 5.2.9).
  - id: it_falisci
    name: "Falisci (Falerii Veteres, Capena)"
    latlon: [42.29, 12.41]
    terrain: hills
    coastal: false
    river: false
    capacity: 40000
    resources: {}
    neighbours: [it_caere, it_sabina, it_tarquinii, it_umbria, it_veii, it_volsinii]
    sources:
      - "Strabo 5.2.9 (Falerii and Faliscum; some call the Falisci a distinct tribe with a language of its own; Nepeta)"
      - "Livy 5.27 (the Faliscan schoolmaster, 394 BC)"
      - "Livy 7.17, 7.20 (Faliscans at war beside Tarquinii, 356-353 BC)"
      - "Polybius 1.65.2 (war on the Falisci; Falerii taken in a few days, 241 BC)"
      - "Zonaras 8.18 (half their land taken; the town on the steep hill pulled down and rebuilt in the open)"
  # 264 BC: Rome's citizen land (ager Romanus) since Veii fell; Sutrium and Nepet are Latin colonies (Velleius 1.14.2), drawn as Rome's.
  - id: it_veii
    name: "Veii and the Ager Veientanus (Sutrium, Nepet)"
    latlon: [42.02, 12.4]
    terrain: hills
    coastal: false
    river: false
    capacity: 60000
    resources: {}
    neighbours: [it_falisci, it_latium, it_roma]
    sources:
      - "Livy 5.22 (the fall of Veii after a ten-year siege, traditionally 396 BC)"
      - "Livy 6.3 (Sutrium an ally of Rome), 6.21 (three commissioners to settle a colony at Nepete)"
      - "Velleius 1.14.2 (Sutrium and Nepe colonies)"
      - "Strabo 5.2.9 (Sutrium, Nepeta; Veii brought low by the Romans)"
  # 264 BC: Rome's: Caere's people hold Roman citizenship without the vote, the 'Caerite tablets' (Strabo 5.2.3).
  - id: it_caere
    name: "Caere (with Pyrgi and Alsium)"
    latlon: [41.99, 12.1]
    terrain: coast
    coastal: true
    river: false
    capacity: 60000
    resources: {}
    neighbours: [it_falisci]
    sources:
      - "Strabo 5.2.3 (Caere shelters Rome's fire and Vestals from the Gauls; citizenship without enrolment, the Caerite tablets)"
      - "Strabo 5.2.8 (Pyrgi, port of the Caeretani; Alsium and Fregena on the coast)"
      - "Livy 5.40, 5.50 (Rome's sacred things carried to Caere; public friendship with Caere)"
      - "Livy 7.20 (Caere given peace and a hundred-year truce, 353 BC)"
      - "Livy 28.45 (Caere gives grain and provisions for Scipio's fleet, 205 BC)"
  # 264 BC: an Etruscan ally of Rome (socius). Cosa, on this coast, is a Latin colony of 273 (Velleius 1.14.7; Livy Per. 14.8): Rome's town, drawn inside the allied province (DEC013).
  - id: it_tarquinii
    name: "Tarquinii and Vulci"
    latlon: [42.25, 11.76]
    terrain: hills
    coastal: true
    river: true
    capacity: 100000
    resources: {}
    neighbours: [it_falisci, it_populonia, it_volsinii]
    sources:
      - "Strabo 5.2.2 (Tarquinii, whence Rome took the triumph, the fasces and divination)"
      - "Strabo 5.2.8 (the coast from Cosa past Gravisci to Pyrgi)"
      - "Livy 7.12 (Rome declares war on Tarquinii, 358 BC)"
      - "Velleius 1.14.7 (colonies at Cosa and Paestum, 273 BC)"
      - "Livy, Periochae 14.8 (colonies founded at Posidonia and Cosa)"
      - "Livy 28.45 (Tarquinii gives sailcloth for Scipio's fleet, 205 BC)"
    disputed: "Cosa was a Latin colony (Rome's) inside allied Etruscan land in 264; the map cannot draw a one-town enclave, so the province stays with the Etruscans."
  # 264 BC: AT WAR with Rome. Volsinii's freedmen had seized the city; Rome marched to restore the old citizens (Zonaras 8.7), and M. Fulvius Flaccus triumphed over the Volsinians on 1 November 264 (Fasti Triumphales).
  # note: Orvieto is the Etruscan Velzna, the Volsinii of 264 BC. The timber is the fir of Perusia, Clusium and Rusellae (Livy 28.45).
  - id: it_volsinii
    name: "Volsinii and Clusium (Perusia, Rusellae, Saturnia)"
    latlon: [42.72, 12.11]
    terrain: hills
    coastal: false
    river: true
    capacity: 90000
    resources: {timber: accessible}
    neighbours: [it_arretium, it_falisci, it_tarquinii, it_umbria]
    sources:
      - "Zonaras 8.7 (the expedition to Volsinii; its servants had taken power and freedom)"
      - "Fasti Triumphales, 264/3 BC (M. Fulvius Flaccus, consul, over the Vulsinienses)"
      - "Livy, Periochae 16.8 (wars against the Carthaginians and the Volsinians)"
      - "Strabo 5.2.9 (Arretium, Perusia, Volsinii; the lakes of Volsinii and Clusium)"
      - "Livy 28.45 (Perusia, Clusium and Rusellae give fir for ships and grain, 205 BC)"
    disputed: "Who led the war: Zonaras 8.7 dates the march on Volsinii to the consulship of Quintus Fabius; the Fasti Triumphales give the triumph (1 November 264) to the consul M. Fulvius Flaccus."
  # 264 BC: an Etruscan ally of Rome (socius).
  # note: ADDED: the Etruscan metal coast. Strabo saw Populonia's own mines worked out; the iron is Elban (Aethalia) ore, smelted and carried to Dicaearchia (Diodorus 5.13.1-2).
  - id: it_populonia
    name: "Populonia, Vetulonia and Elba (Ilva)"
    latlon: [42.99, 10.49]
    terrain: hills
    coastal: true
    river: false
    capacity: 60000
    resources: {iron: accessible}
    neighbours: [it_arretium, it_etruria_n, it_tarquinii]
    sources:
      - "Strabo 5.2.6 (Poplonium on its headland; its mines had failed; iron from Aethalia worked there)"
      - "Diodorus 5.13.1-2 (Aethaleia off Poplonium: iron-rock cut and smelted, sold on to Dicaearchia)"
      - "Livy 28.45 (Populonia gives iron for Scipio's fleet, 205 BC)"
  # 264 BC: an Etruscan ally of Rome (socius).
  - id: it_etruria_n
    name: "Northern Etruria (Volaterrae, Pisae)"
    latlon: [43.4, 10.86]
    terrain: hills
    coastal: true
    river: true
    capacity: 90000
    resources: {timber: accessible}
    neighbours: [it_arretium, it_ligures_apuani, it_populonia]
    sources:
      - "Strabo 5.2.5 (Pisa, between the Arnus and the Ausar; its quarries and ship timber), 5.2.6 (Volaterrae)"
      - "Polybius 2.16.2 (Pisa, the first city of western Etruria)"
      - "Polybius 2.27.1 (the consul Atilius lands at Pisa from Sardinia, 225 BC)"
      - "Livy 28.45 (Volaterrae gives ship-timbers and grain, 205 BC)"
  # 264 BC: an Etruscan ally of Rome (socius); the Gauls had besieged Arretium in 284 and beaten the Roman relief (Polybius 2.19.7-8).
  # note: ADDED: the upper Arno was Rome's advance post against the Gauls; Faesulae is where the Gauls turned in 225 (Polybius 2.25.6).
  - id: it_arretium
    name: "Arretium, Cortona and Faesulae (upper Arno)"
    latlon: [43.46, 11.88]
    terrain: hills
    coastal: false
    river: true
    capacity: 90000
    resources: {clay: accessible}
    neighbours: [it_boii, it_etruria_n, it_populonia, it_senones, it_umbria, it_volsinii]
    sources:
      - "Polybius 2.16.2 (the Ligurians reach inland as far as Arretium)"
      - "Polybius 2.19.7-8 (the Gauls besiege Arretium; the praetor L. Caecilius falls)"
      - "Polybius 2.25.6 (the Gauls withdraw to Faesulae, 225 BC)"
      - "Livy 28.45 (Arretium gives 3,000 shields, 3,000 helmets, spears and tools, 205 BC)"
      - "Pliny NH 35.46 (Bostock; Arretine pottery still prized)"

  # --- Umbria, Picenum and the Adriatic coast ---
  # 264 BC: Umbrian allies of Rome (socii), beaten again in 267-266 (Livy Per. 15.7; triumphs over the Sassinates, Fasti 266).
  #   Narnia is a Latin colony of 299 (Livy 10.10): Rome's town inside allied land (DEC013). Spoletium follows in 241 (Velleius 1.14.8).
  - id: it_umbria
    name: "Umbria (Mevania, Spoletium, Iguvium, Narnia)"
    latlon: [42.93, 12.61]
    terrain: hills
    coastal: false
    river: true
    capacity: 95000
    resources: {}
    neighbours: [it_arretium, it_falisci, it_picenum, it_sabina, it_senones, it_volsinii]
    sources:
      - "Livy 9.41 (the Umbrians routed at Mevania, 308 BC)"
      - "Livy 10.9-10 (Nequinum taken; a colony sent there as an outpost against the Umbrians, named Narnia from the river Nar)"
      - "Livy, Periochae 15.7 (the Umbrians and Sallentines defeated, their surrender accepted)"
      - "Fasti Triumphales, 266/5 BC (D. Junius Pera and N. Fabius Pictor over the Sassinates)"
      - "Velleius 1.14.8 (Spoletium colony)"
      - "Polybius 2.24.7 (Umbrians and Sarsinates of the Apennines, about 20,000, in 225 BC)"
      - "Livy 28.45 (the Umbrian communities promise men; Camerinum, allied on equal terms, sends a cohort, 205 BC)"
    disputed: "Narnia was a Latin colony (Rome's) inside allied Umbria in 264; the map cannot draw a one-town enclave, so the province stays with the Umbrians."
  # 264 BC: Rome's. The Picentes were beaten in 268 and given peace (Livy Per. 15.4; two triumphs, Fasti 268); Hadria (Livy Per. 11.7) and Firmum,
  #   founded as the First Punic War broke out (Velleius 1.14.8), are colonies.
  - id: it_picenum
    name: "Picenum (Asculum, Firmum, Auximum, Ancona)"
    latlon: [42.85, 13.57]
    terrain: hills
    coastal: true
    river: true
    capacity: 130000
    resources: {}
    neighbours: [it_marsi, it_sabina, it_senones, it_umbria]
    sources:
      - "Strabo 5.4.2 (the Picentine country from Ancona: Auxumum, Potentia, Firmum Picenum, Asculum, Adria)"
      - "Livy, Periochae 15.4 (the Picentes subdued and given peace, 268 BC)"
      - "Fasti Triumphales, 268/7 BC (P. Sempronius Sophus and Ap. Claudius Russus over the Picentes)"
      - "Livy, Periochae 11.7 (colonies at Castrum, Sena and Hadria)"
      - "Velleius 1.14.8 (Firmum and Castrum colonies at the outbreak of the First Punic War)"
    disputed: "Livy says the Picentes were given peace in 268 (Per. 15.4), not that their land was annexed; Rome is drawn as holding all of it."
  # 264 BC: Rome's: the ager Gallicus, from which the Senones were driven in 283 (Polybius 2.19.11-12). Sena is a colony; Ariminum a Latin colony
  #   of 268 (Velleius 1.14.7; Livy Per. 15.5), drawn as Rome's. The land is shared out among citizens only in 232 (Polybius 2.21.7-8).
  - id: it_senones
    name: "Ager Gallicus (Sena Gallica, Ariminum)"
    latlon: [43.72, 13.22]
    terrain: plains
    coastal: true
    river: true
    capacity: 55000
    resources: {}
    neighbours: [it_arretium, it_boii, it_picenum, it_umbria]
    sources:
      - "Polybius 2.19.11-12 (the Senones defeated and driven out; Sena, the first colony in Gaul)"
      - "Polybius 2.21.7-8 (the Gallic land called Picenum divided among citizens by Flaminius' law, 232 BC)"
      - "Velleius 1.14.7 (Ariminum and Beneventum colonies, 268 BC)"
      - "Livy, Periochae 15.5 (colonies at Ariminum in Picenum and Beneventum in Samnium)"
      - "Livy, Periochae 11.7 (Sena colony)"
  # 264 BC: allies of Rome (socii) by the treaties of 304, when the Marrucini, Marsi and Paeligni sued for peace and friendship (Livy 9.45).
  # note: Corfinium is central to all four peoples; in the Marsic War it was made their common city, Italica (Strabo 5.4.2).
  - id: it_marsi
    name: "Marsi, Paeligni, Vestini and Marrucini (Marruvium, Corfinium)"
    latlon: [42.12, 13.84]
    terrain: mountains
    coastal: false
    river: true
    capacity: 85000
    resources: {}
    neighbours: [it_aequi, it_frentani, it_hernici, it_picenum, it_samnium]
    sources:
      - "Livy 9.45 (the Marrucini, Marsi, Paeligni and Feretrani obtain peace and a treaty, 304 BC)"
      - "Strabo 5.4.2 (Vestini, Marsi, Peligni, Marrucini; Corfinium, Sulmon, Maruvium, Teate; Corfinium renamed Italica)"
      - "Polybius 2.24.12 (Marsi, Marrucini, Frentani and Vestini, 20,000 foot and 4,000 horse, in 225 BC)"
      - "Livy 28.45 (Marsi, Paeligni and Marrucini volunteer for Scipio's fleet, 205 BC)"
  # 264 BC: allies of Rome (socii). They surrendered in 319 (Livy 9.16); Livy's list of the peoples given a treaty in 304 names the 'Feretrani' beside the Marsi and Paeligni (Livy 9.45).
  - id: it_frentani
    name: "Frentani (Histonium, Anxanum, Larinum)"
    latlon: [42.11, 14.71]
    terrain: hills
    coastal: true
    river: false
    capacity: 35000
    resources: {}
    neighbours: [it_apulia, it_marsi, it_samnium]
    sources:
      - "Strabo 5.4.2 (the Frentani, a Samnite tribe; their ports Orton and Buca, bordering Teanum Apulum)"
      - "Livy 9.16 (the Frentani beaten in one battle, give hostages, 319 BC)"
      - "Livy 9.45 (the Marrucini, Marsi, Paeligni and Feretrani obtain a treaty, 304 BC)"
      - "Polybius 2.24.12 (Marsi, Marrucini, Frentani and Vestini, 20,000 foot and 4,000 horse, in 225 BC)"

  # --- Campania, Samnium and the south ---
  # 264 BC: Rome's. Capua gave itself to Rome in 343 (Livy 7.31) and has held citizenship without the vote since 338 (Livy 8.14; Velleius 1.14.3);
  #   Cales is a Latin colony (Velleius 1.14.3). The Campanian knights were honoured for not joining the Latins (Livy 8.14), hence the horses.
  # note: Neapolis and the Bay are split off as it_neapolis: Capua alone is inland (centre 25 km from the Bay).
  - id: it_campania
    name: "Campania (Capua, Cales, Teanum, Casilinum)"
    latlon: [41.08, 14.25]
    terrain: plains
    coastal: true
    river: true
    capacity: 300000
    resources: {horses: accessible}
    neighbours: [it_aurunci, it_hirpini, it_neapolis, it_samnium]
    sources:
      - "Livy 7.31 (the Campanians surrender Capua and its land to Rome, 343 BC)"
      - "Livy 8.14 (the Campanian knights honoured; citizenship without the vote for Capua, 338 BC)"
      - "Velleius 1.14.3 (citizenship without the vote for the Campanians; colony at Cales)"
      - "Polybius 3.91.2-6 (the plain round Capua, the most celebrated in Italy; Cales, Teanum, Capua in its midst)"
      - "Strabo 5.4.3 (the Campanian plain sown three and four times a year; Falernian, Statanian and Calenian wine)"
      - "Strabo 5.4.10-11 (Capua the capital; Teanum Sidicinum; Cales, Nola, Nuceria)"
      - "Polybius 2.24.14 (Romans and Campanians on the rolls in 225 BC: 250,000 foot, 23,000 horse)"
  # 264 BC: a Greek ally of Rome by treaty (Livy 8.26); Naples lends Rome boats for the first crossing to Sicily (Polybius 1.20.14).
  # note: ADDED: the Greek coast of the Bay is a separate people and harbour from Capua.
  # note: the stone is the Bay's volcanic sand and tufa: Vitruvius 2.6 (pulvis Puteolanus) was not opened.  # unverified: LacusCurtius would not load
  - id: it_neapolis
    name: "Neapolis, Cumae and the Bay (Puteoli, Pompeii, Nola)"
    latlon: [40.85, 14.27]
    terrain: coast
    coastal: true
    river: true
    capacity: 80000
    resources: {sulphur: limited, stone: accessible}
