schema_version: 1
# Meanwhile in the world (D-120): what really happened elsewhere, told in its year in chronicle
# mode. needs_alive: told only while those states still stand.
almanac:
  - {id: rome_gladiators, scenario: rome_264, year: -264, text: "In Rome, the sons of Junius Brutus Pera honour their father's funeral with three pairs of armed slaves fighting to the death - the first gladiatorial games the city has seen."}
  - {id: athens_falls, scenario: rome_264, year: -261, needs_alive: [macedon], text: "Athens, starved by a long siege, surrenders to Antigonus Gonatas of Macedon. Its last war for freedom is over."}
  - {id: syrian_war_two, scenario: rome_264, year: -260, needs_alive: [ptolemaic, seleucid], text: "In the east, Antiochus II and Ptolemy II go to war again over Syria and the cities of the Asian coast."}
  - {id: berenice_lock, scenario: rome_264, year: -246, needs_alive: [ptolemaic], text: "Ptolemy III marches deep into the Seleucid kingdom to avenge his murdered sister. His queen Berenice dedicates a lock of her hair for his safe return; when it vanishes from the temple, the court astronomer finds it among the stars."}
  - {id: eratosthenes, scenario: rome_264, year: -240, needs_alive: [ptolemaic], text: "In Alexandria the librarian Eratosthenes measures the shadow of a stick at noon and works out the size of the Earth - and gets it nearly right."}
  - {id: livius_andronicus, scenario: rome_264, year: -240, text: "At the Roman Games, a Greek freedman named Livius Andronicus stages the first play in Latin, translated from the Greek."}
  - {id: teuta, scenario: rome_264, year: -229, text: "Illyrian pirates under Queen Teuta prey on Italian merchants in the Adriatic. When Roman envoys protest, one of them is murdered on his way home."}
  - {id: colossus_falls, scenario: rome_264, year: -226, needs_alive: [rhodes], text: "An earthquake strikes Rhodes and the Colossus, the great bronze Helios over the harbour, snaps at the knees and falls. An oracle forbids the Rhodians to raise it again."}
  - {id: qin_unifies, scenario: rome_264, year: -221, text: "Far beyond the edge of the known world, the king of Qin conquers the last of his rivals and names himself First Emperor of all China."}
  - {id: raphia, scenario: rome_264, year: -217, needs_alive: [ptolemaic, seleucid], text: "At Raphia, Ptolemy IV defeats Antiochus III in one of the greatest battles of the age: African elephants against Indian, and Egyptians trained in the phalanx for the first time."}
  - {id: philip_hannibal, scenario: rome_264, year: -215, needs_alive: [macedon, carthage], text: "Philip V of Macedon swears alliance with Hannibal. A Roman fleet captures his envoys on their way home with the treaty in their baggage."}
  - {id: magna_mater, scenario: rome_264, year: -204, text: "On the advice of the Sibylline books, Rome brings the black stone of the Great Mother from Pessinus in Asia. A Roman matron, Claudia Quinta, pulls the stranded ship free with her girdle to prove her virtue."}
  - {id: rosetta, scenario: rome_264, year: -196, needs_alive: [ptolemaic], text: "At Memphis, Egyptian priests honour the boy-king Ptolemy V with a decree carved on stone in three scripts: hieroglyphs, demotic and Greek."}
  - {id: magnesia, scenario: rome_264, year: -190, needs_alive: [seleucid], text: "At Magnesia in Asia, the Scipios defeat Antiochus III, the greatest king in the east. Hannibal, his adviser, has fled to his court and must flee again."}
  - {id: hannibal_dies, scenario: rome_264, year: -183, text: "In Bithynia, about to be handed over to Rome, Hannibal takes the poison he has long carried in a ring. In the same year, Scipio Africanus dies in bitter retirement."}
  - {id: eleusis_circle, scenario: rome_264, year: -168, needs_alive: [seleucid], text: "Near Alexandria the Roman envoy Popillius draws a circle in the sand around King Antiochus IV and tells him to decide, before he steps out of it, whether he will leave Egypt. He leaves."}
  - {id: pydna, scenario: rome_264, year: -168, text: "At Pydna, Roman legions break the Macedonian phalanx. The kingdom of Alexander's heirs is no more."}
  - {id: maccabees, scenario: rome_264, year: -167, needs_alive: [seleucid], text: "In Judaea, the priest Mattathias and his sons rise against Antiochus IV: the revolt of the Maccabees."}
  - {id: carneades, scenario: rome_264, year: -155, text: "Athenian philosophers come to Rome on an embassy. Carneades argues for justice one day and against it the next, and Cato has them sent home before they corrupt the young."}
  - {id: corinth_falls, scenario: rome_264, year: -146, text: "In Greece, the consul Mummius destroys Corinth and ships its statues to Rome - warning his sailors that if they break any, they will have to make new ones."}
