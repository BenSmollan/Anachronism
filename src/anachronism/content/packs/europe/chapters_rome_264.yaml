schema_version: 1
# Chronicle mode (D-120) for scenario rome_264: Rome from Messana to the fall of Carthage, 264-146 BC.
# Copied from chapters_rome.yaml (scenario punic_wars) with the provinces moved to the refined map
# of Italy (it_*, si_*, sa_*, co_*) and ids prefixed r264_. Each chapter opens in its year; one choice
# is what history chose (historical: true). Facts follow Polybius (books 1-3, 6, 36-39) and Livy
# (books 21-30), with legends marked as such. benchmark_provinces counts provinces of this map the
# real Rome held then, for comparison with the player.
# Where a chapter takes "Sicily" it takes all four Carthaginian Sicilian provinces (Lilybaeum, Panormus,
# Akragas, Enna): Polybius 1.62-63 has Carthage evacuate Sicily; Hiero kept his own kingdom.
# The Cannae chapter gives away it_campania: Capua went over to Hannibal after Cannae (Livy 23.7-10 # unverified).
chapters:
  - id: r264_messana
    scenario: rome_264
    civ: rome
    year: -264
    title: "The Appeal from Messana"
    place: "Rome, the Forum"
    speaker: ruler
    benchmark_provinces: 12
    story: >-
      Across the straits, in Messana, sit the Mamertines - the "sons of Mars", Campanian
      mercenaries who took the town a generation ago by murdering its men and marrying its
      women. Now Hiero of Syracuse has beaten them by the Longanus river, and they are
      desperate. Some of them have already let a Carthaginian garrison into the citadel.
      Others have sent envoys here, to Rome.


      The Senate cannot decide. To protect murderers is shameful, and Sicily has never been
      Rome's affair; but if Carthage holds Messana, she holds the gate to Italy, a mile of
      water from Rhegium. The consul Appius Claudius has taken the question to the people,
      and promised them plunder. The assembly waits for your word.
    choices:
      - label: "Send the legions across the straits"
        historical: true
        legitimacy_bp: 500
        influence: {nobility: 300}
        outcome: >-
          The consul ferries his legions over by night in borrowed boats. The Carthaginian
          commander, lured to a parley, is seized and gives up the citadel - and is crucified
          by his own people for it. Rome has a foothold in Sicily, and two enemies at once:
          Carthage and Syracuse.
        deeds: {war_with: [carthage, syracuse], take: [si_messana], men: 20000}
      - label: "Decline the appeal and garrison Rhegium"
        wealth_bp: 300
        legitimacy_bp: 900
        materials_bp: -500
        influence: {clergy: 300}
        outcome: >-
          The envoys go home empty-handed and six thousand men are posted at Rhegium instead.
          Within the year a Punic garrison holds Messana, and Carthaginian warships ride at anchor
          in sight of the Italian shore. The legions' pay is saved for the year.
        deeds: {men: 6000}
      - label: "Send envoys to Syracuse and Carthage"
        wealth_bp: -1000
        legitimacy_bp: 200
        unrest_bp: 300
        influence: {nobility: -300}
        outcome: >-
          Roman envoys are heard politely in Syracuse and in Carthage, and nothing is agreed.
          The Mamertines, left alone, open their gates to Carthage.
    history: >-
      The assembly voted to help. Appius Claudius Caudex crossed to Messana in 264 BC, and
      the First Punic War began - in Polybius's words the longest, most unbroken and
      greatest war he knew of: twenty-three years. Rome had almost no warships; Carthage
      was the greatest sea power of the western Mediterranean.
    sources: ["Polybius 1.7-1.12", "Lazenby, The First Punic War (1996)"]

  - id: r264_hiero
    scenario: rome_264
    civ: rome
    year: -263
    until_year: -258
    title: "Hiero Changes Sides"
    place: "Before the walls of Syracuse"
    speaker: syracuse
    needs_war_with: [syracuse]
    story: >-
      Your consuls have marched to the very walls of Syracuse, and sixty-seven Sicilian towns
      have gone over to Rome. Hiero, the old king, is no fool. His envoys come with an offer:
      he will make peace, pay a hundred talents of silver, and feed Rome's armies in Sicily
      from his granaries - if Rome will leave him his city and his crown.


      Carthage, his ally of a year, has sent him no help worth the name.
    choices:
      - label: "Grant Hiero peace and take his grain"
        historical: true
        wealth_bp: 1500
        food_bp: 1000
        outcome: >-
          The treaty is sworn. Syracuse becomes Rome's friend, and Sicilian grain begins to
          flow to the legions. The war is now Rome and Syracuse against Carthage.
        deeds: {ally_with: [syracuse]}
      - label: "Press the siege of Syracuse"
        legitimacy_bp: -200
        materials_bp: -1000
        outcome: >-
          Hiero shuts his gates. Eight thousand more men go to the lines. Syracuse has the
          strongest walls in the Greek world, and Carthage now has a reason to defend them.
        deeds: {men: 8000, grudges: {syracuse: 3000}}
      - label: "Grant peace for the silver, but no alliance"
        wealth_bp: 2800
        food_bp: -500
        legitimacy_bp: -200
        outcome: >-
          Hiero pays his hundred talents and keeps out of the war. His granaries stay closed to
          your armies, and your quartermasters must find their grain elsewhere. Since you offer no
          alliance, Hiero pays a heavier indemnity in silver.
        deeds: {peace_with: [syracuse]}
    history: >-
      In 263 BC Hiero II made peace and alliance with Rome for an indemnity of a hundred
      talents. He kept the treaty faithfully for the rest of his long life - he died in 215 BC,
      past ninety - and his supplies sustained Rome's armies through the war.
    sources: ["Polybius 1.16"]

  - id: r264_fleet
    scenario: rome_264
    civ: rome
    year: -261
    until_year: -250
    title: "A Fleet from a Wreck"
    place: "The shipyards of Ostia"
    speaker: general
    needs_war_with: [carthage]
    story: >-
      Agrigentum has fallen after a seven-month siege, but the war has not moved. Carthage
      rules the sea: her squadrons raid the coasts of Italy at will, and every town in Sicily
      that can be supplied by sea holds out. Rome has never built a warship larger than a
      trireme.


      Then a Carthaginian quinquereme ran aground on our shore. Your shipwrights have taken
      her apart plank by plank. They say they can copy her - a hundred of her - if the
      rowers learn their stroke on benches set up on dry land, while the hulls are built.
    choices:
      - label: "Copy the wreck and build a fleet"
        historical: true
        materials_bp: -3000
        wealth_bp: -2000
        influence: {guilds: 300}
        outcome: >-
          In sixty days the hulls are on the water. On each prow stands the "raven" - a
          hinged bridge with an iron spike that drops onto an enemy deck and holds it fast,
          so that legionaries can fight at sea as they fight on land.
        deeds: {ships: 100}
      - label: "Keep to the land war with more legions"
        legitimacy_bp: -300
        wealth_bp: -500
        outcome: >-
          Fifteen thousand more men go to Sicily and the legions grind on. The coastal towns, fed
          from the sea, laugh at them, and Punic raiders burn villages from Etruria to Bruttium.
        deeds: {men: 15000}
      - label: "Build ships to our own new design"
        needs_adopted: [sternpost_rudder]
        materials_bp: -3000
        wealth_bp: -2000
        outcome: >-
          Rome's shipwrights hang a rudder on the sternpost instead of oars at the sides:
          the new ships turn tighter than any Carthaginian, and their captains need no
          raven to win.
        deeds: {ships: 140}
      - label: "Build twenty triremes to guard the coast"
        materials_bp: -800
        wealth_bp: -500
        outcome: >-
          A small squadron is built to escort the grain ships and drive off raiders. It cannot
          challenge the Punic main fleet, and Carthage keeps the sea.
        deeds: {ships: 20}
    history: >-
      Polybius says Rome built a hundred quinqueremes and twenty triremes in sixty days,
      copying a stranded Carthaginian ship. Gaius Duilius led the new fleet to victory at
      Mylae in 260 BC, using the corvus; some fifty Punic ships were taken or sunk. A column
      decorated with the bronze rams of captured ships was raised to him in the Forum.
    sources: ["Polybius 1.20-1.23"]

  - id: r264_regulus
    scenario: rome_264
    civ: rome
    year: -256
    until_year: -248
    title: "Regulus in Africa"
    place: "Tunis, within sight of Carthage"
    speaker: general
    needs_war_with: [carthage]
    story: >-
      At Ecnomus your fleet met Carthage's in what may be the greatest sea battle ever
      fought - some three hundred thousand men at the oars and on the decks - and won. The
      consul Marcus Atilius Regulus has landed in Africa, beaten a Punic army at Adys and
      taken Tunis. From its walls he can see Carthage.


      Carthage has sent envoys to ask what peace would cost. Regulus, wanting the glory of
      ending the war before his command runs out, writes to ask how hard he may press them.
    choices:
      - label: "Demand Sicily, Sardinia and a heavy tribute"
        historical: true
        legitimacy_bp: -800
        unrest_bp: 600
        food_bp: -1000
        outcome: >-
          Carthage refuses. A Spartan mercenary, Xanthippus, takes their army in hand,
          drills it, and in the spring of 255 BC crushes Regulus on the open plain with
          elephants and cavalry. Regulus is taken prisoner. The fleet that rescues the
          survivors is wrecked by a storm off Camarina.
      - label: "Offer moderate terms: western Sicily, and peace"
        legitimacy_bp: 600
        outcome: >-
          With Roman soldiers at Tunis and their fields burning, the Carthaginians accept.
          Their garrisons sail away from Lilybaeum. A war that might have lasted a
          generation is over in eight years.
        deeds: {peace_with: [carthage], take: [si_lilybaeum, si_panormus, si_akragas, si_enna], grudges: {carthage: 2500}}
      - label: "Reinforce Regulus and keep Carthage besieged"
        wealth_bp: -1000
        legitimacy_bp: 200
        outcome: >-
          The Senate sends reinforcements and bids Regulus hold Tunis through the winter without
          treating. Carthage, seeing the war will go on, begins to look for a general.
        deeds: {men: 10000}
    history: >-
      Regulus offered terms so harsh that Carthage preferred to fight on. Xanthippus defeated
      him at the Bagradas in 255 BC; of some fifteen thousand Romans perhaps two thousand
      escaped. The returning fleet was wrecked off Camarina - Polybius says only 80 of 364
      ships survived. A later legend, perhaps invented, says Regulus was sent to Rome on
      parole to arrange an exchange, urged the Senate to refuse, and went back to Carthage
      to die, keeping his word.
    sources: ["Polybius 1.26-1.37", "Cicero, De Officiis 3.99 (the legend)"]

  - id: r264_drepana
    scenario: rome_264
    civ: rome
    year: -249
    until_year: -243
    title: "The Sacred Chickens"
    place: "Off Drepana, at dawn"
    speaker: diviner
    needs_war_with: [carthage]
    story: >-
      The consul Publius Claudius Pulcher means to surprise the Punic fleet in the harbour of
      Drepana at first light. The keeper of the sacred chickens brings word from the coop:
      the birds will not eat. No Roman general fights when the chickens refuse their grain -
      the gods have spoken against the day.


      Claudius is proud, young and in a hurry. The fleet is already rowing.
    choices:
      - label: "Dismiss the omen and attack at first light"
        historical: true
        legitimacy_bp: -600
        influence: {clergy: -400}
        outcome: >-
          The chickens go over the side and the fleet goes in, strung out in a long line.
          The Carthaginian admiral Adherbal slips out of the harbour, turns, and pins the
          Romans against the shore. Ninety-three of a hundred and twenty ships are lost.
      - label: "Wait a day and take the auspices again"
        legitimacy_bp: 300
        wealth_bp: -400
        influence: {clergy: 300}
        outcome: >-
          The fleet backs water. Surprise is lost, but so is nothing else; the blockade of
          Lilybaeum goes on at the cost of another day's pay and provisions.
      - label: "Attack with half the fleet and hold the rest back"
        legitimacy_bp: -200
        materials_bp: -500
        outcome: >-
          A squadron goes in at dawn while the main body waits beyond the harbour mouth. Adherbal
          is not caught napping, but neither can he trap the whole fleet.
    history: >-
      Claudius had the chickens thrown into the sea - "let them drink, since they will not
      eat" - and attacked. Drepana (249 BC) was Carthage's one great sea victory of the war.
      Recalled and tried, Claudius was heavily fined and died soon after; his sister,
      jostled by a crowd some years later, was heard to wish her brother alive again to lose
      another fleet and thin the crowds. That same year storms destroyed another Roman fleet,
      and for years Rome built no more.
    sources: ["Polybius 1.49-1.51", "Cicero, De Natura Deorum 2.7", "Suetonius, Tiberius 2"]

  - id: r264_citizens_fleet
    scenario: rome_264
    civ: rome
    year: -242
    until_year: -238
    title: "The Citizens' Fleet"
    place: "The Senate house"
    speaker: steward
    needs_war_with: [carthage]
    story: >-
      The treasury is empty. Hamilcar Barca holds out on the slopes of Mount Eryx above our
      army, unbeatable, raiding the coasts of Italy as he pleases. The war has gone on for
      twenty-three years.


      A group of the leading citizens comes to the Senate with an offer: they will build two
      hundred quinqueremes at their own cost - singly, or two and three together - on the
      lines of the fastest Punic ship ever captured. The state will repay them only if the
      fleet wins.
    choices:
      - label: "Take the citizens' offer of ships"
        historical: true
        influence: {nobility: 400, guilds: 200}
        legitimacy_bp: 300
        outcome: >-
          Two hundred ships, lighter and better built than any before, are launched in a
          single summer. The consul Gaius Lutatius Catulus trains their crews hard through
          the winter off Sicily.
        deeds: {ships: 200}
      - label: "Raise a war tax to build a state fleet"
        wealth_bp: 1500
        unrest_bp: 800
        outcome: >-
          The tax is paid, with much cursing. The ships are built, but fewer and slower.
        deeds: {ships: 120}
      - label: "Make peace as things stand"
        legitimacy_bp: -500
        outcome: >-
          Rome and Carthage, both exhausted, agree to stop fighting. Each keeps what it holds.
        deeds: {peace_with: [carthage]}
    history: >-
      In 242 BC the fleet was built on private loans. On 10 March 241 BC, off the Aegates
      Islands, Catulus caught the Carthaginian relief fleet still heavy with supplies for
      Hamilcar's army, sank some fifty ships and took seventy. Carthage, cut off from its
      army in Sicily, gave Hamilcar full powers to make peace.
    sources: ["Polybius 1.59-1.62"]

  - id: r264_lutatius
    scenario: rome_264
    civ: rome
    year: -241
    until_year: -236
    title: "The Peace of Lutatius"
    place: "Mount Eryx, Sicily"
    speaker: carthage
    needs_war_with: [carthage]
    benchmark_provinces: 17
    story: >-
      Hamilcar Barca comes down from Eryx to treat with the consul. He has never lost a
      battle, and he does not ask for mercy; he asks for terms. Carthage will leave Sicily,
      give back your prisoners without ransom, and pay two thousand two hundred talents of
      silver over twenty years. His men will march out under arms.
    choices:
      - label: "Accept peace, with a heavier indemnity"
        historical: true
        wealth_bp: 4000
        legitimacy_bp: 600
        outcome: >-
          The assembly sends ten commissioners to Sicily, who harden the terms. Carthage pays.
          Sicily - all but Hiero's kingdom - is Rome's: her first province beyond the sea.
        deeds: {peace_with: [carthage], take: [si_lilybaeum, si_panormus, si_akragas, si_enna], grudges: {carthage: 3000}}
      - label: "Demand Sicily and Sardinia both"
        wealth_bp: 3800
        legitimacy_bp: 600
        outcome: >-
          Hamilcar's face darkens, but Carthage has no fleet left. Sicily and Sardinia both pass
          to Rome, and in Carthage a grudge takes root that will outlive everyone here. The
          indemnity is raised to match the larger demand.
        deeds: {peace_with: [carthage], take: [si_lilybaeum, si_panormus, si_akragas, si_enna, sa_sardinia], grudges: {carthage: 6000}}
      - label: "Refuse terms and carry the war to Africa"
        unrest_bp: 800
        materials_bp: -1000
        outcome: >-
          The war goes on. Your people, bled for a generation, grumble in the streets.
    history: >-
      The treaty of Lutatius (241 BC): Carthage evacuated Sicily, returned all prisoners, and
      paid 3,200 talents - the Roman people raised the consul's figure of 2,200. Sicily became
      Rome's first overseas province. Hamilcar marched his army off Eryx under arms; it was
      said he made his nine-year-old son Hannibal swear at an altar never to be a friend to
      Rome.
    sources: ["Polybius 1.62-1.63, 3.11 (the oath)"]

  - id: r264_sardinia
    scenario: rome_264
    civ: rome
    year: -238
    until_year: -232
    title: "The Mercenaries' Gift"
    place: "Rome"
    speaker: steward
    needs_peace_with: [carthage]
    needs_owner: {sa_sardinia: carthage}
    benchmark_provinces: 19
    story: >-
      Carthage could not pay the army that fought for her in Sicily. Her mercenaries -
      Libyans, Iberians, Gauls, Greeks - turned on her, and for three years Africa has burned
      in a war so cruel that Polybius will call it the "truceless war". Rome, keeping the
      treaty, even let Carthage buy food and hire men in Italy.


      Now the mutineers who hold Sardinia offer the island to Rome. Carthage, half-dead, is
      gathering ships to take it back.
    choices:
      - label: "Accept the island and answer any protest with war"
        historical: true
        wealth_bp: 2000
        legitimacy_bp: -300
        outcome: >-
          Rome declares that Carthage's fleet is a threat, and demands Sardinia and another
          twelve hundred talents for peace. Carthage, with nothing left, gives both. In Spain,
          Hamilcar Barca begins to build a new empire - and a new army.
        deeds: {take: [sa_sardinia, co_corsica], grudges: {carthage: 5000}}
      - label: "Refuse the island and keep the treaty"
        wealth_bp: 800
        legitimacy_bp: 1100
        influence: {clergy: 200}
        outcome: >-
          Rome refuses the island. Carthage crushes the mutineers and keeps Sardinia; its envoys
          thank the Senate, and mean it. Carthage repays your good faith with grain and silver.
        deeds: {peace_with: [carthage]}
      - label: "Send envoys to judge between Carthage and the mutineers"
        wealth_bp: -500
        legitimacy_bp: 300
        outcome: >-
          Rome offers to arbitrate. The mutineers will not hear it and Carthage will not wait; the
          island is retaken by force, and the Senate is thanked for its patience.
        deeds: {peace_with: [carthage]}
    history: >-
      In 238/237 BC Rome accepted the mutineers' offer and, when Carthage prepared to recover
      Sardinia, threatened war unless Carthage gave up the island and paid 1,200 talents
      more. Exhausted, Carthage yielded. Polybius, Rome's friend, judged this an act without
      excuse and the real cause of the war that followed. Corsica was taken soon after.
    sources: ["Polybius 1.65-1.88, 3.10, 3.28"]

  - id: r264_ebro
    scenario: rome_264
    civ: rome
    year: -226
    until_year: -220
    title: "A Line on the Ebro"
    place: "New Carthage, Spain"
    speaker: carthage
    needs_alive: [carthage]
    needs_peace_with: [carthage]
    story: >-
      In Spain, Hamilcar Barca conquered half a country before he drowned in a river in 228
      BC. His son-in-law Hasdrubal has founded a gleaming new capital on the coast - New
      Carthage - and rules the south of the peninsula like a king, with its silver mines
      paying for Carthage's recovery. Massalia, Rome's old friend, is frightened.


      And in the north of Italy the Gauls are gathering. Hasdrubal's envoys suggest a line:
      Carthage will not cross the river Ebro in arms.
    choices:
      - label: "Agree that Carthage stays south of the Ebro"
        historical: true
        legitimacy_bp: 200
        outcome: >-
          The treaty is made. Rome turns to face the Gauls with quiet at her back.
      - label: "Demand that Carthage halt its Spanish conquests"
        legitimacy_bp: 300
        outcome: >-
          Hasdrubal answers with smooth words and goes on as before. In Carthage, the Barcid
          party grows stronger with every insult.
        deeds: {grudges: {carthage: 2000}}
      - label: "Offer Saguntum Rome's friendship and ask no treaty"
        legitimacy_bp: 300
        wealth_bp: -300
        outcome: >-
          Rome sends gifts and friendly words to the town south of the river, and signs nothing
          with Hasdrubal. The Gauls remain Rome's first concern.
    history: >-
      Around 226 BC Hasdrubal agreed not to cross the Ebro in arms. Rome, facing a great
      Gallic invasion, was content. Saguntum, a town south of the river, later put itself
      under Rome's protection - and became the spark of the next war.
    sources: ["Polybius 2.13, 3.27"]

  - id: r264_telamon
    scenario: rome_264
    civ: rome
    year: -225
    until_year: -220
    title: "The Gauls at Telamon"
    place: "Etruria"
    speaker: general
    needs_alive: [e2_insubres]
    benchmark_provinces: 19
    story: >-
      Seventy thousand Gauls - Boii, Insubres and spearmen from beyond the Alps, the Gaesatae,
      who fight naked for glory - have poured into Etruria and sacked it to within three days'
      march of Rome. Laden with plunder they are heading home along the coast.


      By chance one consular army is coming up behind them; the other, back from Sardinia,
      has just landed at Pisa in front of them.
    choices:
      - label: "Close both armies on them, then march on the Po"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          At Telamon the Gauls are caught between two armies and fight back to back, their
          war-trumpets and horns making a din the Romans never forget. Forty thousand are
          killed. Over the next three years Roman armies cross the Po.
        deeds: {war_with: [e2_boii, e2_insubres], men: 15000}
      - label: "Let them go home with their plunder and fortify the passes"
        unrest_bp: 500
        wealth_bp: -1000
        outcome: >-
          The Gauls go home rich. Eight thousand men are posted to forts on the roads north, and
          Rome waits for the Gauls to come again.
        deeds: {men: 8000}
      - label: "Close both armies on them, then offer the Boii terms"
        legitimacy_bp: 600
        wealth_bp: 500
        outcome: >-
          The Gauls are cut down at Telamon, but when the Boii send to ask for terms you grant
          them, keeping the Insubres isolated. The Po valley is left for another year.
        deeds: {men: 12000}
    history: >-
      At Telamon in 225 BC the Gauls were caught between two consular armies; one consul,
      Atilius, was killed, but some forty thousand Gauls fell. Rome then conquered the Po
      valley (224-222 BC); at Clastidium in 222 the consul Marcellus killed the Gallic king
      Viridomarus with his own hand.
    sources: ["Polybius 2.22-2.35"]

  - id: r264_saguntum
    scenario: rome_264
    civ: rome
    year: -218
    until_year: -214
    title: "Peace or War in a Fold of a Toga"
    place: "The council chamber of Carthage"
    speaker: ruler
    needs_alive: [carthage]
    needs_peace_with: [carthage]
    benchmark_provinces: 21
    story: >-
      Hannibal, Hamilcar's son, was twenty-six when the army in Spain made him its general.
      Last year he besieged Saguntum, Rome's friend, for eight months, and took it. Rome did
      nothing in time.


      Now your envoys stand before the council of Carthage. Their eldest, Quintus Fabius,
      gathers a fold of his toga in his hand. "Here," he says, "we carry peace and war. Choose
      which you will." The presiding magistrate answers: "Give us whichever you please."
    choices:
      - label: "Declare war and call out the legions"
        historical: true
        legitimacy_bp: 600
        outcome: >-
          "We accept it," the council shouts back, "and we shall fight it as we accept it." The
          Senate plans to fight in Spain and in Africa, far from Italy.
        deeds: {war_with: [carthage]}
      - label: "Accept the loss of Saguntum and keep the peace"
        legitimacy_bp: -800
        unrest_bp: 400
        outcome: >-
          The envoys come home. Rome's allies notice that Rome's friendship did not save
          Saguntum.
        deeds: {peace_with: [carthage]}
      - label: "Demand Hannibal's surrender before any war"
        legitimacy_bp: 1300
        wealth_bp: -500
        outcome: >-
          The council refuses to give up its general. Rome holds the high ground in the world's
          eyes, and the legions are called out. Rome is seen to have asked for justice before
          drawing the sword.
        deeds: {men: 8000}
    history: >-
      Livy tells the scene of the toga; Polybius records only that war was declared. Rome
      expected to fight in Spain and Africa. Hannibal had other plans: in the summer of 218 BC
      he marched from New Carthage with perhaps ninety thousand men and thirty-seven
      elephants, crossed the Pyrenees and the Rhone, and in the autumn snows the Alps.
    sources: ["Livy 21.18", "Polybius 3.20-3.33"]

  - id: r264_cannae
    scenario: rome_264
    civ: rome
    year: -216
    until_year: -210
    title: "The Delayer"
    place: "Apulia"
    speaker: general
    needs_war_with: [carthage]
    story: >-
      Hannibal came down from the Alps with twenty-six thousand men left, and destroyed one
      Roman army at the Trebia and another at Lake Trasimene, where the consul Flaminius died
      with fifteen thousand of his men in the fog. The dictator Quintus Fabius then took
      command: he shadowed Hannibal from the hills, never gave battle, and starved him of
      forage. The people call him Cunctator - the Delayer - and they do not mean it kindly.


      This year the consuls Varro and Paullus command eight legions, the greatest army Rome
      has ever raised. Hannibal has seized the grain depot at Cannae.
    choices:
      - label: "Shadow Hannibal from the hills and refuse battle"
        food_bp: -2000
        unrest_bp: 600
        legitimacy_bp: -200
        outcome: >-
          Rome bears the jeers and the burning farms, and ten thousand more men are levied to dog
          Hannibal's march. Hannibal ravages Apulia but cannot take a walled town without siege
          engines, and no Roman army offers itself up. Slowly his army thins.
        deeds: {men: 10000}
      - label: "Give battle with the great army and end it"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1200
        food_bp: -1000
        outcome: >-
          On 2 August, on the open plain by the Aufidus, Hannibal lets his centre give way.
          His African veterans close on the Roman flanks; his cavalry shuts the trap behind.
          By evening some fifty thousand Romans lie dead, among them the consul Paullus and
          eighty senators. Capua and much of the south go over to Hannibal.
        deeds: {give: [it_campania], give_to: carthage}
      - label: "Hold him with crossbows behind palisades"
        needs_adopted: [crossbow]
        legitimacy_bp: 1000
        outcome: >-
          Hannibal's veterans run into a wall of stakes and bolts that strike through shield
          and mail. His cavalry cannot close. For the first time in Italy, he withdraws.
      - label: "Offer battle only on rough ground, away from the plain"
        legitimacy_bp: -300
        unrest_bp: 300
        food_bp: -500
        outcome: >-
          The consuls march into the hills and offer battle where cavalry cannot ride. Hannibal
          will not be drawn, and the army grumbles at the delay.
        deeds: {men: 15000}
    history: >-
      Cannae (216 BC) was the worst defeat in Rome's history, studied by generals ever since.
      Yet Rome refused to ransom its captured soldiers or to talk of peace, armed even slaves,
      and went back to Fabius's way of war. "Cunctator" became a title of honour; Ennius wrote
      that one man, by delaying, restored the state.
    sources: ["Polybius 3.107-3.118", "Livy 22.44-22.61"]

  - id: r264_archimedes
    scenario: rome_264
    civ: rome
    year: -213
    until_year: -208
    title: "The Engines of Archimedes"
    place: "Syracuse"
    speaker: general
    needs_war_with: [carthage]
    needs_not_owner: {si_syracuse: rome}
    story: >-
      Old Hiero is dead; his young grandson went over to Carthage and was murdered, and
      Syracuse has shut its gates against Rome. Marcus Claudius Marcellus besieges it by land
      and sea - and is beaten by one old man.


      Archimedes, the geometer, has built the defences. Iron claws swing out from the walls,
      lift your ships by the prow and drop them; catapults strike at every range; the
      sailors say a man cannot show a finger above the rail. Marcellus jokes that Archimedes
      uses his ships to ladle sea-water into his cups.
    choices:
      - label: "Press the siege, and take the city when you can"
        historical: true
        legitimacy_bp: 400
        wealth_bp: 2000
        outcome: >-
          After two years, during a festival of Artemis, Roman soldiers climb an ill-guarded
          wall by night. Syracuse is sacked. Archimedes, bent over figures drawn in the dust,
          is killed by a soldier who does not know him - against Marcellus's orders.
        deeds: {take: [si_syracuse, si_catana], peace_with: [syracuse]}
      - label: "Spare Archimedes at any cost, and bring him to Rome"
        legitimacy_bp: 400
        knowledge_bp: 3000
        idea: place_value_numerals
        outcome: >-
          Marcellus posts a guard on the old man's house before the assault. Archimedes comes
          to Rome, grumbling, with his books - among them one that counts the grains of sand
          it would take to fill the universe.
        deeds: {take: [si_syracuse, si_catana], peace_with: [syracuse]}
      - label: "Win Syracuse back with offers, not engines"
        wealth_bp: -2000
        outcome: >-
          Envoys and gold do what the legions could not. Syracuse returns to its old alliance,
          its walls - and its geometer - intact.
        deeds: {ally_with: [syracuse]}
    history: >-
      Syracuse fell to Marcellus in 212 BC. Plutarch tells that Archimedes was killed by a
      soldier while absorbed in a problem; Cicero, as governor of Sicily, found his
      neglected tomb, marked with a sphere and a cylinder. The burning mirrors that set ships
      alight are a later legend.
    sources: ["Polybius 8.3-8.7", "Livy 24.34, 25.31", "Plutarch, Marcellus 14-19"]

  - id: r264_ad_portas
    scenario: rome_264
    civ: rome
    year: -211
    until_year: -206
    title: "Hannibal at the Gates"
    place: "Rome, the Colline Gate"
    speaker: ruler
    needs_war_with: [carthage]
    story: >-
      Your armies have Capua - the second city of Italy, which went over to Hannibal after
      Cannae - under siege. To draw them off, Hannibal has marched on Rome itself. His camp
      is three miles from the walls; his horsemen ride up to the Colline Gate. Mothers sweep
      the temple floors with their hair.


      The Senate must decide: recall the legions from Capua, or trust the walls.
    choices:
      - label: "Keep the legions at Capua and trust the walls"
        historical: true
        legitimacy_bp: 800
        unrest_bp: -400
        outcome: >-
          The legions stay. Hannibal looks at the walls, and at the fresh legions mustering
          inside them, and marches away. Capua falls; its leaders are put to death.
      - label: "Recall the legions to defend the city"
        legitimacy_bp: 200
        wealth_bp: -500
        outcome: >-
          The legions hurry home and Hannibal slips away south. Capua is relieved and the war
          drags on.
      - label: "Offer Hannibal battle before the walls with the city levy"
        legitimacy_bp: 1500
        unrest_bp: 100
        outcome: >-
          The consuls draw up every man the city can muster. Hannibal also draws up his army, but
          wind and rain make fighting impossible; the siege of Capua goes on meanwhile. The city
          sees its consuls stand and fight, and takes heart.
        deeds: {men: 12000}
    history: >-
      In 211 BC Hannibal marched on Rome to relieve Capua; the Senate held its nerve and
      Capua fell. Livy tells that the field where Hannibal camped was sold in Rome at that
      very time at its full price - and that Hannibal, hearing of it, put the bankers' shops
      of the Forum up for auction in turn.
    sources: ["Polybius 9.3-9.9", "Livy 26.7-26.11"]

  - id: r264_scipio_spain
    scenario: rome_264
    civ: rome
    year: -210
    until_year: -204
    title: "A Young Man for Spain"
    place: "The Campus Martius"
    speaker: general
    needs_war_with: [carthage]
    needs_owner: {car_gades: carthage}
    benchmark_provinces: 23
    story: >-
      In Spain both Scipio brothers, your generals there, have been killed in the same month,
      and their armies broken. The people are to elect a new commander, and no seasoned man
      will stand.


      Then Publius Cornelius Scipio, son and nephew of the dead men, steps forward. He is
      twenty-five and has held no high office. At the Trebia, a boy of seventeen, he saved his
      father's life. People say he spends hours alone in the temple of Jupiter.
    choices:
      - label: "Give the command to young Scipio"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Scipio learns from fishermen that the lagoon behind New Carthage drains at evening.
          He storms the walls from the front while a picked force wades through the shallows
          behind - and takes Carthage's Spanish capital in a single day. Four years later Spain
          is Roman.
        deeds: {take: [car_gades, east_iberia], grudges: {carthage: 2000}}
      - label: "Send an experienced consul with fresh legions"
        legitimacy_bp: 300
        outcome: >-
          A safe man goes to Spain with twelve thousand men and wins a few towns. Hannibal's
          brothers keep their armies, their silver mines and their road to Italy.
        deeds: {men: 12000}
      - label: "Hold the Ebro line and send no more men"
        wealth_bp: 1000
        legitimacy_bp: -300
        outcome: >-
          Rome keeps to the Ebro and spends nothing in Spain. The treasury breathes, but the
          Barcid armies grow.
        deeds: {ships: 10}
    history: >-
      Scipio took New Carthage in 209 BC by wading the drained lagoon, and destroyed Carthage's
      power in Spain at Ilipa in 206. Hannibal's brother Hasdrubal escaped to Italy, only to be
      defeated and killed at the Metaurus in 207; his head was thrown into Hannibal's camp.
    sources: ["Polybius 10.2-10.20, 11.20-11.33", "Livy 26.18-26.51"]

  - id: r264_to_africa
    scenario: rome_264
    civ: rome
    year: -204
    until_year: -200
    title: "Carry the War to Africa"
    place: "The Senate house"
    speaker: general
    needs_war_with: [carthage]
    benchmark_provinces: 23
    story: >-
      Scipio is consul. He asks for leave to cross to Africa: strike at Carthage, he says, and
      Hannibal must leave Italy to save her. The old Fabius rises against him - first drive
      Hannibal out of Italy; do not risk Rome's last army across the sea, as Regulus did.


      The Senate gives Scipio Sicily, and leave to cross "if it is in the interest of the
      state" - but no new army. He will have to raise volunteers himself.
    choices:
      - label: "Let Scipio cross with the volunteers he can raise"
        historical: true
        outcome: >-
          Seven thousand volunteers flock to him, and the disgraced survivors of Cannae, who
          have been kept in Sicily for twelve years, beg to go too. He lands near Utica, burns
          the enemy's winter camps, and wins over the Numidian prince Masinissa. Carthage
          recalls Hannibal.
        deeds: {men: 25000}
      - label: "Hold the legions in Italy and finish Hannibal first"
        wealth_bp: -500
        outcome: >-
          Eight thousand more men go to the legions in Italy. Hannibal, in the toe of Bruttium,
          cannot win and will not leave.
        deeds: {men: 8000}
      - label: "Send Scipio to Sicily to prepare, and decide later"
        legitimacy_bp: 700
        outcome: >-
          Scipio builds ships and drills his men in Sicily while the Senate waits. The crossing is
          put off a year.
        deeds: {ships: 30}
    history: >-
      Scipio landed in Africa in 204 BC. In 203 Carthage recalled Hannibal from Italy, where he
      had fought for fifteen years without losing a battle of importance. Livy says he left
      Italy as an exile leaves his homeland.
    sources: ["Livy 28.40-28.45, 29.24-29.27, 30.20"]

  - id: r264_zama
    scenario: rome_264
    civ: rome
    year: -202
    until_year: -198
    title: "Zama"
    place: "The plain of Zama, Africa"
    speaker: carthage
    needs_war_with: [carthage]
    benchmark_provinces: 23
    story: >-
      The two greatest generals of the age meet between their armies, each with an
      interpreter. Hannibal speaks of fortune and how it turns; he offers Sicily, Sardinia and
      Spain - everything Carthage has already lost - for peace. Scipio answers that Carthage
      broke a truce last year; she must accept harder terms, or fight.


      Behind Hannibal stand eighty elephants. Behind Scipio, Masinissa's Numidian horsemen.
    choices:
      - label: "Break off the parley and fight on the plain"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 3000
        outcome: >-
          The elephants, maddened by trumpets, run down the lanes or turn on their own horse.
          The infantry lines grind together until Masinissa's cavalry falls on Hannibal's rear.
          Hannibal himself tells Carthage it has lost not a battle but the war.
        deeds: {peace_with: [carthage], tributaries: [carthage], take: [car_gades], grudges: {carthage: 4000}}
      - label: "Accept Hannibal's offer of Sicily, Sardinia and Spain"
        legitimacy_bp: 300
        wealth_bp: 1000
        outcome: >-
          Peace is sworn on the field. Carthage keeps her fleet and her pride, and Hannibal
          goes home to rule her.
        deeds: {peace_with: [carthage], take: [car_gades]}
      - label: "Offer firm terms: Spain, the fleet and an indemnity"
        wealth_bp: 3000
        legitimacy_bp: 1000
        outcome: >-
          Scipio names his price: Carthage gives up Spain and her fleet and pays a large sum over
          many years. Hannibal considers, and the council sends to Rome. Scipio's terms are firm,
          and the Roman people approve.
        deeds: {peace_with: [carthage], tributaries: [carthage], take: [car_gades]}
    history: >-
      At Zama (202 BC) Scipio won the decisive battle and took the name Africanus. The peace
      of 201: Carthage gave up Spain and all but ten warships, paid ten thousand talents over
      fifty years, and could make no war without Rome's leave. Hannibal, elected to high
      office, reformed Carthage's finances so well that she offered to pay off the indemnity
      early - which alarmed Rome more than it pleased it.
    sources: ["Polybius 15.5-15.19", "Livy 30.29-30.37"]

  - id: r264_delenda
    scenario: rome_264
    civ: rome
    year: -150
    until_year: -144
    title: "Carthago Delenda Est"
    place: "The Senate house"
    speaker: steward
    needs_alive: [carthage]
    needs_peace_with: [carthage]
    story: >-
      Old Marcus Porcius Cato has come back from an embassy to Africa. In the Senate he lets a
      bundle of fresh figs fall from his toga: they were picked in Carthage three days ago,
      he says - that is how near the enemy is. And he ends every speech, whatever its
      subject, the same way: "And I think Carthage must be destroyed."


      Carthage is rich again, and has gone to war against Masinissa without Rome's leave -
      a breach of the treaty. Scipio Nasica answers Cato every time: Rome needs a rival to
      keep her honest.
    choices:
      - label: "Declare war and raise a great army"
        historical: true
        unrest_bp: -300
        legitimacy_bp: 300
        outcome: >-
          Rome demands hostages, and gets them; demands Carthage's weapons, and gets two
          hundred thousand sets of armour and two thousand catapults. Then it orders the
          Carthaginians to leave their city and live ten miles from the sea. They refuse,
          and forge new weapons day and night, the women cutting their hair for bowstrings.
        deeds: {war_with: [carthage], men: 40000}
      - label: "Let Carthage stand and curb Masinissa"
        legitimacy_bp: -200
        wealth_bp: 1000
        outcome: >-
          Carthage stands, rich and harmless. Cato dies the next year, still ending his
          speeches the same way.
        deeds: {peace_with: [carthage]}
      - label: "Demand hostages and arms, and promise Carthage its city"
        legitimacy_bp: 200
        unrest_bp: -200
        outcome: >-
          The Senate promises that Carthage shall keep its city and its laws if it gives hostages
          and disarms. The armament is handed over, and the next demand is not yet made.
        deeds: {men: 20000}
    history: >-
      The Third Punic War began in 149 BC. Carthage, disarmed, held out for three years.
      Polybius, who was there, thought Rome's demands deliberately impossible to accept.
    sources: ["Plutarch, Cato the Elder 27", "Appian, Punica 74-93", "Polybius 36.2-36.7"]

  - id: r264_fall_of_carthage
    scenario: rome_264
    civ: rome
    year: -146
    until_year: -136
    title: "The Fires of Carthage"
    place: "Carthage"
    speaker: general
    needs_owner: {car_carthage: rome}
    story: >-
      For six days and nights your soldiers have fought their way up the streets from the
      harbour to the citadel, house by house, roof by roof. Now the city burns. Scipio
      Aemilianus - grandson by adoption of Africanus - watches it, and his friend Polybius
      sees him weep.


      He is quoting Homer: "A day will come when sacred Troy shall perish." Asked why, he
      says he fears that one day someone will speak those words of Rome.
    choices:
      - label: "Raze Carthage to the ground"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          The city burns for seventeen days. Fifty thousand survivors are sold as slaves. The
          ground is cursed, and no one may live there. Africa becomes a Roman province.
      - label: "Rebuild it as a Roman city"
        wealth_bp: 2000
        knowledge_bp: 1000
        outcome: >-
          Roman colonists move into the cleared streets, and the great harbour fills with
          ships again - under a different flag.
      - label: "Level the walls but keep the harbour garrisoned"
        wealth_bp: 1000
        unrest_bp: 300
        outcome: >-
          Walls and towers are pulled down, the citadel is held by a garrison, and the harbour is
          kept open for Roman ships.
    history: >-
      Carthage fell in 146 BC, the same year Rome destroyed Corinth. The story that the ground
      was sown with salt appears in no ancient source; it is a modern legend. A century later
      Julius Caesar founded a Roman colony on the site, and Roman Carthage became one of the
      great cities of the empire.
    sources: ["Appian, Punica 127-135", "Polybius 38.21-38.22", "Ridley, 'To Be Taken with a Pinch of Salt' (1986)"]

